/* ---------- the crate (MAKE IT YOURS): a diagonal row of records on the brand collage ----------
   One screen tall; arrows / swipe / keys move the row. */
/* tall enough for the page scroll to move through --steps records while the stage stays pinned */
.crate{position:relative; height:calc(100svh + var(--steps, 3) * 34svh); background:var(--ink)}
.crate__bg{position:absolute; inset:0; z-index:0; display:flex}
.crate__bg>i{flex:1; background-repeat:repeat; background-size:auto 680px; background-position:center; opacity:.30}
.crate__bg>i:last-child{opacity:.36}
.crate__bg::after{content:""; position:absolute; inset:0;
  background:radial-gradient(70% 70% at 54% 52%,rgba(6,5,6,.88) 18%,rgba(6,5,6,.55) 55%,rgba(6,5,6,.25))}
.crate__stage{position:sticky; top:0; z-index:2; height:100svh; min-height:640px; overflow:hidden; outline:none; background:var(--ink)}
.crate__gl{position:absolute; inset:0; z-index:1}
.crate__scribble{position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; overflow:visible; opacity:0}
.crate__scribble path{fill:none; stroke:var(--ember); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:1 1; stroke-dashoffset:1; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 6px rgba(192,53,63,.45))}
.crate__meta{position:absolute; z-index:4; left:var(--gutter); top:calc(var(--nav-h) + 22px); width:min(350px, 27vw); pointer-events:none}
.crate__eyebrow{margin-bottom:12px}
.crate__head{font-family:var(--display); font-weight:500; letter-spacing:-.02em; font-size:clamp(1.9rem,3.1vw,3rem); line-height:1; margin:0 0 20px; text-wrap:balance}
.crate__rows dd span,.crate__fv span,.crate__fl span{display:inline-block}
.crate__rows{margin:0; border-top:1px solid rgba(243,239,232,.24)}
.crate__rows>div{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:8px 0 7px; border-bottom:1px solid rgba(243,239,232,.24)}
.crate__rows dt{font-family:var(--mono); font-size:.58rem; letter-spacing:.2em; color:var(--muted); flex:none}
.crate__rows dd{margin:0; text-align:right; overflow:hidden; font-size:.95rem; min-width:0; text-wrap:balance}
.crate__rows>div:first-child dd{font-family:var(--display); font-size:1.15rem; text-transform:uppercase; letter-spacing:-.01em}
.crate__hint{margin-top:18px; color:var(--muted); letter-spacing:.2em; line-height:1.9}
.crate__hint-m{display:none}
.crate__facts{position:absolute; z-index:4; left:50%; bottom:clamp(22px,5svh,50px); transform:translateX(-50%);
  display:flex; gap:clamp(36px,8vw,120px); text-align:center; pointer-events:none; width:max-content; max-width:calc(100vw - 2*var(--gutter) - 200px)}
.crate__fl{font-family:var(--mono); font-size:.58rem; letter-spacing:.22em; color:var(--muted); margin-bottom:8px; overflow:hidden}
.crate__fv{font-family:var(--display); font-weight:500; text-transform:uppercase; letter-spacing:-.01em;
  font-size:clamp(1.05rem,1.9vw,1.65rem); line-height:1.02; overflow:hidden}
.crate__nav{position:absolute; z-index:5; right:var(--gutter); bottom:clamp(22px,5svh,50px); display:flex; align-items:center; gap:14px}
.crate__count{color:var(--cream); letter-spacing:.2em; min-width:7ch; text-align:center; font-size:.72rem}
.crate__arrow{width:66px; height:66px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  background:var(--cream); border:2px solid var(--cream); color:var(--ink); box-shadow:0 8px 28px rgba(0,0,0,.55), 0 0 0 6px rgba(243,239,232,.08);
  transition:background .25s, border-color .25s, transform .35s var(--e-spring), opacity .25s; backdrop-filter:blur(6px)}
.crate__arrow svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.crate__arrow:hover:not(:disabled){background:var(--oxblood); border-color:var(--ember); color:var(--cream); transform:scale(1.08)}
.crate__arrow:active:not(:disabled){transform:scale(.94)}
.crate__arrow:disabled{opacity:.35; background:transparent; color:var(--cream); border-color:rgba(243,239,232,.45); box-shadow:none; cursor:default}
.crate__arrow:focus-visible{outline:2px solid var(--ember); outline-offset:3px}
/* a real link to the record in front, for keyboards and screen readers */
.sr-focus{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.sr-focus:focus{z-index:6; width:auto; height:auto; clip-path:none; left:var(--gutter); bottom:clamp(22px,5svh,50px);
  padding:10px 14px; background:var(--ink); border:1px solid var(--ember); font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase}
@media(max-width:1023px){ .crate__meta{width:min(380px, 42vw)} }
@media(max-width:767px){
  .crate__stage{min-height:600px}
  .crate__meta{width:calc(100% - 2*var(--gutter)); top:calc(var(--nav-h) + 6px)}
  .crate__eyebrow{margin-bottom:6px}
  .crate__head{font-size:clamp(1.55rem,7vw,2rem); margin-bottom:10px}
  .crate__rows>div{padding:5px 0 4px}
  .crate__rows dd{font-size:.85rem}
  .crate__rows>div:first-child dd{font-size:1rem}
  .crate__rows>div:nth-child(3){display:none}
  .crate__hint{display:none}
  .crate__facts{bottom:calc(92px + env(safe-area-inset-bottom,0px)); gap:26px; max-width:calc(100vw - 2*var(--gutter))}
  .crate__fv{font-size:1rem}
  .crate__nav{left:50%; right:auto; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
@media(prefers-reduced-motion:reduce){ .crate__arrow{transition:none} }
/* no WebGL: show the records as a simple list of links */
.crate--flat .crate__gl,.crate--flat .crate__scribble,.crate--flat .crate__facts,.crate--flat .crate__nav{display:none}
.crate--flat .sr-focus{position:absolute; width:auto; height:auto; clip-path:none; left:var(--gutter); bottom:clamp(22px,5svh,50px)}

#buy{scroll-margin-top:calc(var(--nav-h) + 8px)}
/* the product stage: give the media box the stage's width so the record (sized as a % of it) shows */
#stagemedia{width:100%; display:grid; place-items:center}
/* product page: the liquid album-art backdrop, fixed behind the content */
.pliq{position:fixed; inset:0; z-index:0; pointer-events:none}
.pliq canvas{display:block}
.pdp-wrap{position:relative; z-index:1}
/* the live wallpaper sits over the collage fallback and replaces it once running */
.crate__wall{position:absolute; inset:0; z-index:1}
.crate--live .crate__bg>i{display:none}
.crate--live .crate__bg::after{display:none}
.crate--flat{height:auto}

/* ---------- artist groups on the vinyl / posters / polaroids pages ---------- */
.ag-grid{align-items:start}
.ag{position:relative; display:flex; flex-direction:column}
.ag__head{all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; gap:12px; position:relative;
  transition:transform 380ms var(--e-spring)}
.ag__head:hover{transform:translateY(-4px)}
.ag__head:focus-visible{outline:2px solid var(--ember); outline-offset:4px}
.ag__media{width:100%}
.ag__head:hover .ag__media{box-shadow:var(--sh-lift)}
/* more than one album: a second sleeve peeks out behind the first */
.ag__media--stack{overflow:visible}
.ag__media--stack::before{content:""; position:absolute; inset:0; z-index:-1; border:1px solid var(--border); background:var(--elevated-2);
  transform:translate(7px,-7px); transition:transform var(--d-std) var(--e-out-expo)}
.ag__head:hover .ag__media--stack::before{transform:translate(11px,-11px)}
.ag__meta{display:flex; flex-direction:column; gap:5px; padding-right:34px}
.ag__name{font-family:var(--display); font-size:clamp(1.05rem,1.6vw,1.35rem); line-height:1.1; letter-spacing:-.01em}
.ag__sub{display:flex; flex-wrap:wrap; column-gap:12px; row-gap:2px; color:var(--muted)}
.ag__sub>span{white-space:nowrap}
.ag__chev{position:absolute; right:0; bottom:4px; width:28px; height:28px; border-radius:50%; border:1px solid var(--border-2);
  display:grid; place-items:center; transition:background .25s, border-color .25s, transform .35s var(--e-out-expo)}
.ag__chev::before{content:""; width:7px; height:7px; border-right:1.5px solid var(--cream); border-bottom:1.5px solid var(--cream); transform:translateY(-2px) rotate(45deg)}
.ag__head:hover .ag__chev{border-color:var(--ember)}
.ag.is-open .ag__chev{transform:rotate(180deg); background:var(--oxblood); border-color:var(--oxblood)}
/* the dropdown: grid-rows trick animates to the list's natural height */
.ag__drop{display:grid; grid-template-rows:0fr; transition:grid-template-rows .45s var(--e-out-expo)}
.ag.is-open .ag__drop{grid-template-rows:1fr}
.ag__in{overflow:hidden; min-height:0}
.ag__list{list-style:none; margin:12px 0 0; padding:0; border-top:1px solid var(--border)}
.ag__row{display:flex; align-items:center; border-bottom:1px solid var(--border)}
.ag__link{flex:1; min-width:0; display:flex; align-items:center; gap:12px; padding:10px 0; transition:color .2s}
.ag__link:hover{color:var(--ember)}
.ag__thumb{flex:none; width:42px; height:42px; display:grid; place-items:center; overflow:hidden; background:var(--elevated)}
.ag__thumb img{width:100%; height:100%; object-fit:cover}
.ag__thumb--rec{background:none}
.ag__thumb--rec .record{--size:42px !important; width:42px}
.ag__album{flex:1; min-width:0; font-family:var(--display); font-size:.98rem; line-height:1.2; display:flex; flex-direction:column; gap:3px; overflow-wrap:anywhere}
.ag__tags{font-family:var(--mono); font-size:.55rem; letter-spacing:.14em; color:var(--muted)}
.ag__price{color:var(--cream); white-space:nowrap}
.ag__add{flex:none; width:30px; height:30px; margin-left:10px; border-radius:50%; border:1px solid var(--border-2); background:none; color:var(--cream);
  cursor:pointer; font-size:1rem; line-height:1; transition:background .2s, border-color .2s}
.ag__add:hover{background:var(--oxblood); border-color:var(--oxblood)}
@media(prefers-reduced-motion:reduce){ .ag__drop{transition:none} .ag__head,.ag__chev{transition:none} }
@media(max-width:767px){ .ag__thumb{width:36px; height:36px} .ag__thumb--rec .record{--size:36px !important; width:36px} .ag__link{gap:9px} .ag__add{width:28px; height:28px; margin-left:6px} .ag__meta{padding-right:32px} }
/* policy pages */
.policy{margin-top:40px; display:flex; flex-direction:column; gap:30px}
.policy section{border-top:1px solid var(--border); padding-top:20px}
.policy h2{margin:0 0 10px}
.policy p{margin:0}
.policy__nav{display:flex; flex-wrap:wrap; gap:22px; margin-top:56px; padding-top:20px; border-top:1px solid var(--border)}
.policy__nav a{color:var(--muted)} .policy__nav a.is-on,.policy__nav a:hover{color:var(--cream)}

/* ---------- every CSS record wears the realistic pressing ----------
   brand/disc.webp is the 3D record rendered top-down without a label. It doesn't turn:
   grooves look the same at any angle and the light should stay put, so only the label
   (and the etched ring) rotate on top of it. */
.record::before{content:""; position:absolute; inset:0; border-radius:50%; z-index:0;
  background:var(--disc-img, radial-gradient(circle,#151414 0 17%,#090909 17% 96%,#1a1919 96%)) center/100% 100% no-repeat;
  box-shadow:var(--sh-record)}
.record__disc{background:none; box-shadow:none; z-index:1}
.record__grooves,.record__grooves2,.record__deadwax,.record__sheen{display:none}
.record__rim{box-shadow:inset 0 0 0 1px rgba(0,0,0,.55); background:none; z-index:2}
.record__label{box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.035), 0 2px 8px rgba(0,0,0,.6)}
.wall__item .record::before{transition:transform 380ms var(--e-spring)} .wall__item:hover .record::before{transform:translateY(-16px) scale(1.06)}

.fdisc__rule{display:none}
/* dropdown rows: album + size on the left, the price in its own column */
.ag__size{font-family:var(--mono); font-size:.56rem; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.ag__link .ag__price{flex:none; font-family:var(--mono); font-size:.74rem; color:var(--cream); margin-left:10px; white-space:nowrap}

/* ---------- transitions between home sections ---------- */
/* hero → bestsellers: the collage melts into the dark the contours rise out of */
.fhero::before{content:""; position:absolute; left:0; right:0; bottom:0; height:40%; z-index:1; pointer-events:none;
  background:linear-gradient(to bottom, rgba(13,11,12,0), rgba(13,11,12,.8) 60%, #0d0b0c)}
/* and over the record itself, only in the last strip, so the disc sinks into the dark instead of being cut */
.fhero::after{content:""; position:absolute; left:0; right:0; bottom:0; height:16%; z-index:3; pointer-events:none;
  background:linear-gradient(to bottom, rgba(13,11,12,0), rgba(13,11,12,.55) 55%, #0d0b0c)}
.crate{--enter:0; margin-top:-1px}
.crate__wall{-webkit-mask-image:linear-gradient(to bottom, transparent calc(var(--enter) * 8%), #000 calc(var(--enter) * 62%));
  mask-image:linear-gradient(to bottom, transparent calc(var(--enter) * 8%), #000 calc(var(--enter) * 62%))}
.crate__stage{background:#0d0b0c}
/* the wall photo → the red manifesto band → the drop: no hard edges */
/* the stage already shades its photo with ::after; its <img> wrapper carries the fade into the red band */
.stage__img::after{content:""; position:absolute; left:0; right:0; bottom:0; height:38%; pointer-events:none;
  background:linear-gradient(to bottom, rgba(18,7,8,0), #120708)}
.stage__in{position:relative; z-index:2}
[data-section="THE DROP"]::before{content:""; position:absolute; left:0; right:0; top:0; height:180px; z-index:1; pointer-events:none;
  background:linear-gradient(to bottom, #120708, rgba(18,7,8,0))}

/* ---------- hero call to action ---------- */
.cta-shop{position:relative; display:inline-flex; align-items:center; gap:14px; height:66px; padding:0 9px 0 10px; border-radius:999px;
  background:var(--cream); color:var(--ink); font-family:var(--mono); font-size:.8rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
  box-shadow:0 14px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(243,239,232,.6); isolation:isolate; overflow:hidden;
  transition:background .35s var(--e-out-expo), color .35s var(--e-out-expo), transform .45s var(--e-spring), box-shadow .35s}
/* a sweep of light crosses it every few seconds */
.cta-shop::before{content:""; position:absolute; top:0; bottom:0; left:-40%; width:30%; z-index:-1; pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent); transform:skewX(-18deg);
  animation:ctaSweep 4.2s cubic-bezier(.6,0,.2,1) 1.6s infinite}
@keyframes ctaSweep{0%{left:-40%} 32%,100%{left:130%}}
/* and a soft ring breathes out from it, so the eye finds it */
.cta-shop::after{content:""; position:absolute; inset:-1px; border-radius:inherit; pointer-events:none; z-index:-2;
  box-shadow:0 0 0 0 rgba(192,53,63,.55); animation:ctaPulse 2.8s ease-out 1.2s infinite}
@keyframes ctaPulse{0%{box-shadow:0 0 0 0 rgba(192,53,63,.55)} 70%,100%{box-shadow:0 0 0 18px rgba(192,53,63,0)}}
.cta-shop__disc{width:46px; height:46px; border-radius:50%; flex:none; position:relative;
  background:var(--disc-img, #0b0a0b) center/100% 100%; box-shadow:0 2px 8px rgba(0,0,0,.45); animation:ctaSpin 3.2s linear infinite}
.cta-shop__disc i{position:absolute; inset:33%; border-radius:50%; background:radial-gradient(circle,#0b0a0b 0 10%, var(--ember) 12% 100%)}
@keyframes ctaSpin{to{transform:rotate(360deg)}}
.cta-shop__txt{padding:0 4px}
.cta-shop__arrow{width:48px; height:48px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--oxblood); color:var(--cream);
  transition:transform .45s var(--e-spring), background .3s}
.cta-shop__arrow svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .45s var(--e-spring)}
.cta-shop:hover{background:var(--ember); color:var(--cream); transform:translateY(-3px) scale(1.04); box-shadow:0 20px 50px rgba(192,53,63,.45), 0 0 0 1px var(--ember)}
.cta-shop:hover .cta-shop__disc{animation-duration:.9s}
.cta-shop:hover .cta-shop__arrow{background:var(--cream); color:var(--oxblood); transform:translateX(3px)}
.cta-shop:hover .cta-shop__arrow svg{transform:translateX(2px)}
.cta-shop:active{transform:translateY(-1px) scale(.97)}
.cta-shop:focus-visible{outline:2px solid var(--cream); outline-offset:4px}
@media(max-width:767px){ .cta-shop{height:58px; font-size:.72rem} .cta-shop__disc{width:40px; height:40px} .cta-shop__arrow{width:42px; height:42px} }
@media(prefers-reduced-motion:reduce){ .cta-shop::before,.cta-shop::after,.cta-shop__disc{animation:none} }
/* the red band's collage fades in under the wall photo instead of starting on a line */

/* phones: an opened artist becomes a full-width panel, cover beside the name, albums below */
@media(max-width:767px){
  .ag.is-open{grid-column:1/-1}
  .ag.is-open .ag__head{flex-direction:row; align-items:center; gap:16px}
  .ag.is-open .ag__media{width:40%; flex:none}
  .ag.is-open .ag__meta{flex:1}
}
.ag__album{overflow-wrap:break-word}

/* ---- album → size step (posters) ---- */
.ag__row--multi{display:block}
.ag__pick{all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; gap:12px; padding:10px 0; transition:color .2s}
.ag__pick:hover{color:var(--ember)}
.ag__pick:focus-visible{outline:2px solid var(--ember); outline-offset:2px}
.ag__pchev{flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--border-2); display:grid; place-items:center; transition:transform .35s var(--e-out-expo), background .2s, border-color .2s}
.ag__pchev::before{content:""; width:6px; height:6px; border-right:1.5px solid var(--cream); border-bottom:1.5px solid var(--cream); transform:translateY(-2px) rotate(45deg)}
.ag__pick:hover .ag__pchev{border-color:var(--ember)}
.ag__row.is-open .ag__pchev{transform:rotate(180deg); background:var(--oxblood); border-color:var(--oxblood)}
.ag__row.is-open .ag__pick{color:var(--cream)}
.ag__sizes{display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s var(--e-out-expo)}
.ag__row.is-open .ag__sizes{grid-template-rows:1fr}
.ag__sin{overflow:hidden; min-height:0}
.ag__step{margin:0 0 6px 54px; color:var(--muted); letter-spacing:.16em}
.ag__slist{list-style:none; margin:0 0 12px 54px; padding:0; display:flex; flex-direction:column; gap:6px}
.ag__srow{display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:rgba(243,239,232,.025); transition:border-color .2s, background .2s}
.ag__srow:hover{border-color:var(--ember); background:rgba(192,53,63,.08)}
.ag__slink{flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:8px 0 8px 10px}
.ag__badge{flex:none; min-width:44px; text-align:center; font-family:var(--mono); font-size:.62rem; letter-spacing:.08em; padding:4px 6px; border:1px solid var(--border-2); color:var(--cream)}
.ag__sname{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; font-size:.82rem; line-height:1.2}
.ag__dim{font-family:var(--mono); font-size:.55rem; letter-spacing:.1em; color:var(--muted)}
.ag__slink .ag__price{flex:none; font-family:var(--mono); font-size:.76rem; color:var(--cream); white-space:nowrap}
.ag__sadd{flex:none; margin-right:8px; height:30px; padding:0 14px; border-radius:999px; border:1px solid var(--border-2); background:none; color:var(--cream); font-family:var(--mono); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; transition:background .2s, border-color .2s}
.ag__sadd:hover,.ag__sadd:focus-visible{background:var(--oxblood); border-color:var(--oxblood)}
@media(max-width:767px){ .ag__step,.ag__slist{margin-left:45px} .ag__pick{gap:9px} .ag__sadd{padding:0 11px; margin-right:6px} .ag__badge{min-width:38px} }
@media(prefers-reduced-motion:reduce){ .ag__sizes,.ag__pchev{transition:none} }

/* narrow artist cards (desktop grid): badge already names the size, so drop the label and indent */
.ag__in{container-type:inline-size}
@container (max-width:340px){
  .ag__step,.ag__slist{margin-left:0}
  .ag__slab{display:none}
  .ag__dim{font-size:.6rem; color:rgba(243,239,232,.7)}
  .ag__slink{gap:8px; padding-left:8px}
  .ag__badge{min-width:40px; padding:4px}
  .ag__sadd{width:30px; height:30px; padding:0; border-radius:50%; margin-right:6px}
  .ag__saddt{font-size:0}
  .ag__saddt::before{content:"+"; font-size:.95rem; letter-spacing:0}
}

/* ---- size headings on the posters pages ---- */
.stabs{display:flex; gap:8px; flex-wrap:wrap; margin:-6px 0 40px; padding-bottom:22px; border-bottom:1px solid var(--border)}
.stab{display:flex; flex-direction:column; gap:4px; min-width:118px; padding:12px 18px 11px; border:1px solid var(--border-2); text-decoration:none; color:var(--cream); transition:border-color .2s, background .2s, transform .2s var(--e-ui)}
.stab:hover{border-color:var(--ember); transform:translateY(-2px)}
.stab__name{font-family:var(--display); font-size:1.18rem; line-height:1.1; letter-spacing:-.01em}
.stab__meta{color:var(--muted); letter-spacing:.12em}
.stab.is-on{background:var(--oxblood); border-color:var(--oxblood)}
.stab.is-on .stab__meta{color:rgba(243,239,232,.78)}
@media(max-width:767px){
  .stabs{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:-10px -16px 28px; padding:0 16px 16px; gap:6px}
  .stabs::-webkit-scrollbar{display:none}
  .stab{flex:none; min-width:0; padding:10px 14px 9px}
  .stab__name{font-size:1rem}
}
@media(prefers-reduced-motion:reduce){ .stab{transition:none} }

/* ---- the wall photo, shown whole: the full portrait photo sits centred, a blurred copy fills the sides ---- */
.stage__img img{filter:brightness(.74) saturate(.95)}
.stage__img .stage__bg{display:none}
.stage__img::after{height:14%; background:linear-gradient(to bottom, rgba(13,11,12,0), #0d0b0c)}
.stage::after{background:radial-gradient(60% 46% at 50% 50%, rgba(6,5,6,.42), transparent 75%)}
@media(min-width:768px){
  /* full-width and landscape; taller than before so more of the wall shows */
  .stage{min-height:0; height:min(112vh, 1100px)}
  .stage__img .stage__fg{width:100%; height:100%; object-fit:cover; object-position:50% 42%}
}

/* ---- the manifesto, now a slim strip between the wall photo and the drop ---- */
.why-strip{position:relative; padding:16px var(--gutter); background:#0d0b0c;
  border-block:1px solid rgba(192,53,63,.22); text-align:center}
.why-strip__t{margin:0 auto; max-width:none; font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em;
  font-size:clamp(.6rem,.95vw,.74rem); line-height:1.7; color:rgba(243,239,232,.74)}
.why-strip__t b{font-family:var(--display); font-weight:400; font-style:italic; text-transform:none; letter-spacing:0;
  font-size:1.5em; color:var(--ember)}
[data-section="THE DROP"]::before{background:linear-gradient(to bottom, #0d0b0c, rgba(13,11,12,0))}

/* ---- vinyl sale: struck MRP beside the sale price ---- */
.mrp{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--ember); text-decoration-thickness:1.5px; font-size:.86em; margin-right:.2em}
.sale{color:var(--cream)}
.fmt .f-price .mrp{display:block; margin:0 0 1px}

/* ---- slim sale bar above the header: the header grows by its height, so every --nav-h offset still clears it ---- */
:root{--bar-h:28px}
:root{--nav-h:calc(56px + var(--bar-h))}
@media(min-width:480px){:root{--nav-h:calc(60px + var(--bar-h))}}
@media(min-width:768px){:root{--nav-h:calc(64px + var(--bar-h))}}
.hdr{flex-direction:column; align-items:stretch}
.hdr__in{flex:1}
/* the sale ribbon: red caution tape, text running */
.tape{--tape:#D8312A; display:block; overflow:hidden; background:var(--tape); color:#0b0809; text-decoration:none;
  font-family:var(--shout); text-transform:uppercase; white-space:nowrap}
.tape__t{display:inline-flex; will-change:transform; animation:tapeRun 38s linear infinite}
.tape__i{display:inline-flex; align-items:center}
.tape__i>*{padding-inline:.7em}
.tape__i b{font-weight:400; letter-spacing:.04em}
.tape__i s{text-decoration-thickness:2px; opacity:.6}
.tape__i em{font-style:normal; background:#0b0809; color:var(--tape); padding:0 .3em}
.tape__i>span::after{content:"✦"; margin-left:1.4em; font-size:.7em; vertical-align:.12em}
@keyframes tapeRun{to{transform:translateX(-50%)}}
.salebar.tape{flex:none; height:var(--bar-h); line-height:var(--bar-h); font-size:.98rem; letter-spacing:.06em}
.salebar.tape:hover .tape__t{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){ .tape__t{animation:none} }

/* ---- hero: the collage behind the record, brighter ---- */
.fhero__col>i{opacity:.72}
.fhero__col>i:last-child{opacity:.76}
.fhero__col::after{background:radial-gradient(78% 62% at 50% 48%,rgba(6,5,6,.62) 22%,rgba(6,5,6,.22) 62%,rgba(6,5,6,.04))}
.ag__price .mrp{display:block; margin:0 0 1px; font-size:.82em; text-align:right}
.ag__price{text-align:right; line-height:1.15}
.ag__sub .mrp{margin-right:.35em}

/* ---- the sale section: two strips of tape crossing over a spray-painted price ---- */
.salesec{--tape:#D8312A; position:relative; overflow:hidden; background:#0b0809; text-align:center;
  padding:clamp(150px,16vw,220px) var(--gutter); isolation:isolate}
.salesec::before{content:""; position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.55; mix-blend-mode:screen;
  background:radial-gradient(60% 50% at 50% 55%, rgba(216,49,42,.22), transparent 70%)}
.salesec__tape{position:absolute; left:-10%; right:-10%; z-index:3; pointer-events:none}
.salesec__tape .tape__t{display:inline-flex; background:var(--tape); color:#0b0809; font-family:var(--shout); text-transform:uppercase;
  font-size:clamp(1.1rem,2vw,1.6rem); line-height:2.1; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,.6)}
.salesec__tape--a{top:clamp(34px,5vw,64px); transform:rotate(-4deg)}
.salesec__tape--b{top:clamp(52px,7vw,96px); transform:rotate(3.5deg)}
.salesec__tape--b .tape__t{animation-direction:reverse; animation-duration:44s; filter:brightness(.88)}
.salesec__in{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center}
.salesec__k{margin:0; font-family:var(--shout); text-transform:uppercase; color:var(--tape); letter-spacing:.02em;
  font-size:clamp(1.6rem,3.6vw,3rem); line-height:1}
.salesec__was{margin:14px 0 0; font-family:var(--mono); text-transform:uppercase; letter-spacing:.2em; font-size:.8rem; color:rgba(243,239,232,.6)}
.salesec__was s{text-decoration-color:var(--tape); text-decoration-thickness:2px; color:rgba(243,239,232,.8); font-size:1.15em}
/* the price: sprayed on — soft edges, overspray halo, grain */
.salesec__now{margin:4px 0 34px; font-family:var(--shout); color:var(--tape); line-height:.9; letter-spacing:-.01em;
  font-size:clamp(7rem,21vw,17rem); filter:url(#spray);
  text-shadow:0 0 18px rgba(216,49,42,.55), 0 0 60px rgba(216,49,42,.25)}
.salesec .cta-shop{margin-top:0}
@media(max-width:767px){ .salesec{padding-block:120px 110px} .salesec__now{margin-bottom:26px} }

/* ================= phones: speed and layout pass ================= */
/* the footer always paints above the product page's fixed album-art backdrop */
.ftr{position:relative; z-index:2; background:var(--ink)}
.pliq--static{background-size:cover; background-position:center; filter:blur(30px) brightness(.32) saturate(.9); transform:scale(1.2)}
.emptyframe{min-width:0; text-align:center; padding:8px; overflow-wrap:anywhere}
@media(max-width:767px){
  /* heavy full-screen effects off: animated grain blended over everything, blurred glass bars */
  #grain,#vignette{display:none}
  .hdr,.hdr.is-solid{backdrop-filter:none; -webkit-backdrop-filter:none; background:rgba(12,9,10,.96)}
  .mega,.menu{backdrop-filter:none; -webkit-backdrop-filter:none}
  /* hero: the tiny corner captions crowded the record */
  .fhero__hint,.fhero__hint2{display:none}
  /* bestsellers: one screen, not pinned — swipe or tap the arrows */
  .crate{height:auto}
  .crate__stage{position:relative; height:max(640px, 92svh); min-height:0}
  /* bigger tap targets */
  .ag__add{width:36px; height:36px; margin-left:4px}
  .ag__meta{padding-right:40px}
  .crate__arrow{width:58px; height:58px}
  .footer-news,.ftr__grid>div:last-child{display:none}
}
@media(max-width:767px){
  .stage::after{background:radial-gradient(85% 42% at 50% 50%, rgba(6,5,6,.72), rgba(6,5,6,.2) 75%, transparent)}
}

function addToCart(slug, format, qty = 1, originEl) {

/* Flies a small ghost from the clicked element to the cart icon — the
   visual "causality" link between pressing Add and the cart updating.
   Falls back to firing onLand immediately when there's nothing to
   animate from, under reduced motion, or if either rect is empty. */
function flyToCart(originEl, onLand) {
  const cartBtn = $('#cartbtn');
  if (RM() || !originEl || !cartBtn) { if (onLand) onLand(); return; }
  const from = originEl.getBoundingClientRect(), to = cartBtn.getBoundingClientRect();
  if (!from.width || !to.width) { if (onLand) onLand(); return; }
  const ghost = document.createElement('div');
  ghost.className = 'fly-ghost'; ghost.setAttribute('aria-hidden', 'true');
  ghost.style.left = (from.left + from.width / 2 - 8) + 'px';
  ghost.style.top = (from.top + from.height / 2 - 8) + 'px';
  document.body.appendChild(ghost);
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  const arc = -Math.max(60, Math.abs(dy) * .6);
  const anim = ghost.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1, offset: 0 },
    { transform: `translate(${dx * .55}px, ${dy * .55 + arc}px) scale(.65)`, opacity: 1, offset: .6 },
    { transform: `translate(${dx}px, ${dy}px) scale(.15)`, opacity: 0, offset: 1 }
  ], { duration: 620, easing: 'cubic-bezier(.32,.8,.42,1)' });
  anim.onfinish = () => { ghost.remove(); if (onLand) onLand(); };
}
function cartMaths() {

  const saved = sets * (FMT.vinyl.price * 3 - 2199);
  return { sub, sets, saved, total: sub - saved };

/* ---------- toast ---------- */
function toast(msg) {
  const wrap = $('#toasts'); if (!wrap) return;
  while (wrap.children.length >= 2) removeToast(wrap.firstElementChild, true);
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `${esc(msg)}<span class="toast__bar"></span>`;
  wrap.appendChild(t); setTimeout(() => removeToast(t), 4000);
}
/* Removes a toast with a spring-out instead of just vanishing, then lets
   any sibling left in the stack slide smoothly into its new spot (a small
   FLIP) rather than snapping up when the gap closes. `instant` skips the
   exit animation for the forced eviction when a third toast arrives. */
function removeToast(t, instant) {
  if (!t || !t.parentNode) return;
  const wrap = t.parentNode;
  const settle = () => {
    const siblings = Array.from(wrap.children).filter(c => c !== t);
    const before = siblings.map(c => c.getBoundingClientRect().top);
    t.remove();
    if (RM()) return;
    siblings.forEach((c, i) => {
      const dy = before[i] - c.getBoundingClientRect().top;
      if (Math.abs(dy) > .5) c.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.3,1.6,.5,1)' });
    });
  };
  if (instant || RM()) { settle(); return; }
  t.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(6px) scale(.96)' }],
    { duration: 220, easing: 'cubic-bezier(.4,0,1,1)' }).onfinish = settle;
}

/* the substrate: two sets of very large, very faint groove arcs.
   the brand's own line-work, so the page always sits on a record. */
function grooveField() {
  const arcs = (n, o, step) => {
    let d = '';
    for (let i = 0; i < n; i++) d += `<circle cx="500" cy="500" r="${o + i * step}"/>`;
    return d;
  };
  const svg = (n, o, step, w, a) =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">` +
    `<g fill="none" stroke="rgb(243,239,232)" stroke-opacity="${a}" stroke-width="${w}">` +
    arcs(n, o, step) + `</g></svg>`;
  const enc = v => 'url("data:image/svg+xml;utf8,' + encodeURIComponent(v) + '")';
  const el = document.getElementById('field');
  if (el) el.style.backgroundImage = enc(svg(46, 60, 9.4, .8, .085)) + ',' + enc(svg(34, 90, 12, .7, .06));
}

/* ---------- sound: procedural, reactive, off by default, and it stays off unless asked.
   No ambient bed, no drone — nothing plays on its own. Every sound here fires in
   direct response to something the visitor does: spinning a record, clicking a
   control, adding something to the crate. All synthesized at runtime with the
   Web Audio API — no external audio file, no licensing question. ---------- */
const Sound = (() => {
  let ctx = null, enabled = false, scratch = null;

  function ensureCtx() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noiseBuffer(seconds) {
    const rate = ctx.sampleRate, buf = ctx.createBuffer(1, Math.max(1, Math.floor(rate * seconds)), rate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  /* the needle touching down: a soft low thump plus a brief touchdown scratch —
     plays once when a vinyl format lands on screen, never on a loop */
  function needleDrop() {
    if (!enabled || !ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine'; osc.frequency.setValueAtTime(190, t); osc.frequency.exponentialRampToValueAtTime(65, t + 0.2);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    osc.connect(og); og.connect(ctx.destination); osc.start(t); osc.stop(t + 0.26);
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.14);
    const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 2500; band.Q.value = 1.1;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    n.connect(band); band.connect(ng); ng.connect(ctx.destination); n.start(t); n.stop(t + 0.16);
  }
  /* a small, dry tick for UI moments — a button, a tab, placing something in the crate */
  function tick() {
    if (!enabled || !ctx) return;
    const t = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.02);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1100;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    n.connect(hp); hp.connect(g); g.connect(ctx.destination); n.start(t); n.stop(t + 0.04);
  }
  /* live turntable scratch, wired to how fast/which way the visitor is actually
     dragging a record — starts on grab, tracks velocity in real time, stops on release */
  function scratchStart() {
    if (!enabled || !ctx || scratch) return;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(2); src.loop = true;
    const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 500; band.Q.value = 5;
    const gain = ctx.createGain(); gain.gain.value = 0.0001;
    src.connect(band); band.connect(gain); gain.connect(ctx.destination); src.start();
    scratch = { src, band, gain };
  }
  function scratchUpdate(vel) {
    if (!enabled || !ctx || !scratch) return;
    const speed = Math.min(1, Math.abs(vel) / 900);
    const t = ctx.currentTime;
    scratch.band.frequency.setTargetAtTime(400 + speed * 2600, t, 0.03);
    scratch.band.Q.setTargetAtTime(6 - speed * 3.5, t, 0.03);
    scratch.gain.gain.setTargetAtTime(speed > 0.03 ? 0.03 + speed * 0.05 : 0.0001, t, 0.04);
  }
  function scratchStop() {
    if (!scratch) return;
    const { src, gain } = scratch, t = ctx.currentTime;
    gain.gain.cancelScheduledValues(t); gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.09);
    setTimeout(() => { try { src.stop(); } catch (e) {} }, 120);
    scratch = null;
  }
  function enable() { if (!ensureCtx()) return false; enabled = true; tick(); return true; }
  function disable() { enabled = false; scratchStop(); }
  return { enable, disable, needleDrop, tick, scratchStart, scratchUpdate, scratchStop, get enabled() { return enabled; } };
})();

/* ------------------------------------------------------------------
   Mouse drag-to-scroll for a horizontal strip (the home picker's
   thumbnail rail, the mobile "wall" fallback): grab anywhere on the
   strip and it tracks the pointer 1:1; let go and it keeps going at
   the release velocity, decelerating like a flick-scroll; overshoot
   past either end resists with the same rubber-band curve Apple uses
   for scroll bounce, then eases back. Never fights native touch
   scrolling (it bails on touch pointers immediately) and sits out
   entirely under reduced motion, where the plain overflow-x scrollbar
   is left to do the job. */
function mountDragScroll(el) {
  if (!el || el.__dragScroll || RM()) return;
  el.__dragScroll = true;
  const BAND = 0.55; // resistance constant — higher = softer edge
  const rubber = (over, dim) => (over * dim * BAND) / (dim + BAND * Math.abs(over));
  const maxScroll = () => Math.max(0, el.scrollWidth - el.clientWidth);
  let dragging = false, moved = false, pid = null;
  let startX = 0, startScroll = 0, lastX = 0, lastT = 0, vel = 0;
  let over = 0, raf = 0, tickT = 0;

  function setOver(px) { over = px; el.style.transform = px ? `translate3d(${px.toFixed(1)}px,0,0)` : ''; }

  function frame(t) {
    const dt = Math.min(.048, Math.max(.001, (t - tickT) / 1000)); tickT = t;
    const f = dt * 60; // elapsed time in 60fps-frame units, so decay is refresh-rate independent
    let alive = false;
    if (!dragging && Math.abs(vel) > 3) {
      const max = maxScroll(), next = el.scrollLeft - vel * dt;
      if (next < 0) { setOver(rubber(-next, el.clientWidth || 1)); el.scrollLeft = 0; vel *= Math.pow(0.05, f); }
      else if (next > max) { setOver(-rubber(next - max, el.clientWidth || 1)); el.scrollLeft = max; vel *= Math.pow(0.05, f); }
      else { el.scrollLeft = next; vel *= Math.pow(0.9, f); if (over) setOver(0); }
      if (Math.abs(vel) < 3) vel = 0;
      alive = true;
    } else if (!dragging) {
      vel = 0;
    }
    if (!dragging && !vel && over) {
      const next = over * Math.pow(0.001, f);
      setOver(Math.abs(next) < .4 ? 0 : next);
      alive = true;
    }
    raf = alive ? requestAnimationFrame(frame) : 0;
  }
  function wake() { if (!raf) { tickT = performance.now(); raf = requestAnimationFrame(frame); } }

  let hasCapture = false;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;      // never fight native touch scrolling
    cancelAnimationFrame(raf); raf = 0;
    dragging = true; moved = false; hasCapture = false; pid = e.pointerId;
    startX = e.clientX; startScroll = el.scrollLeft;
    lastX = e.clientX; lastT = performance.now(); vel = 0;
  });
  el.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== pid) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 6) {
      moved = true;
      if (!hasCapture) {
        try { el.setPointerCapture(pid); hasCapture = true; } catch (err) {}
        el.classList.add('is-dragging');
      }
    }
    if (!moved) return;
    const max = maxScroll(), target = startScroll - dx;
    if (target < 0) { setOver(rubber(-target, el.clientWidth || 1)); el.scrollLeft = 0; }
    else if (target > max) { setOver(-rubber(target - max, el.clientWidth || 1)); el.scrollLeft = max; }
    else { el.scrollLeft = target; if (over) setOver(0); }
    const now = performance.now(), mdt = Math.max(8, now - lastT);
    vel = (e.clientX - lastX) / (mdt / 1000);
    lastX = e.clientX; lastT = now;
  });
  function release(e) {
    if (!dragging || (e && e.pointerId !== pid)) return;
    dragging = false;
    el.classList.remove('is-dragging');
    if (hasCapture) {
      try { el.releasePointerCapture(pid); } catch (err) {}
      hasCapture = false;
    }
    if (moved) {
      // swallow the click a drag-release generates on whatever's under the pointer,
      // so letting go over a thumbnail doesn't also select it
      const swallow = ev => { ev.preventDefault(); ev.stopPropagation(); };
      el.addEventListener('click', swallow, { capture: true, once: true });
    }
    wake();
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
}

const revealIO = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); revealIO.unobserve(e.target); } });

const GLYPH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/·#';
function scramble(el) {
  if (RM()) { el.textContent = el.dataset.txt; return; }
  const final = el.dataset.txt; let i = 0;
  const id = setInterval(() => {
    i++;
    el.textContent = final.slice(0, i) + Array.from({ length: Math.max(0, final.length - i) },
      () => GLYPH[(Math.random() * GLYPH.length) | 0]).join('');
    if (i >= final.length) { clearInterval(id); el.textContent = final; }
  }, 24);
}
const scrambleIO = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { scramble(e.target); scrambleIO.unobserve(e.target); } });
}, { threshold: .5 });

function countUp(el) {
  const target = parseFloat(el.dataset.count), suffix = el.dataset.suffix || '', pre = el.dataset.pre || '';
  if (RM()) { el.textContent = pre + target.toLocaleString('en-IN') + suffix; return; }
  const t0 = performance.now(), dur = 900;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = pre + Math.round(target * e).toLocaleString('en-IN') + (k === 1 ? suffix : '');
    if (k < 1) requestAnimationFrame(step);
  })(performance.now());
}
const countIO = new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { countUp(e.target); countIO.unobserve(e.target); } });
}, { threshold: .6 });

function bindEffects(root = document) {
  $$('.reveal', root).forEach(el => revealIO.observe(el));
  $$('.lines', root).forEach(el => revealIO.observe(el));
  $$('[data-txt]', root).forEach(el => { el.textContent = ''; scrambleIO.observe(el); });
  $$('[data-count]', root).forEach(el => countIO.observe(el));
  $$('.btn--primary, .btn--secondary', root).forEach(btn => {
    if (RM() || btn.__mag) return; btn.__mag = 1;
    const inner = $('.btn__mag', btn); if (!inner) return;

      const d = Math.hypot(dx, dy);

    });

}

}

      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(bufTo.cvs, 0, 0);

      bufFrom.ctx.drawImage(bufTo.cvs, 0, 0);

      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = 1 - e;
      ctx.drawImage(bufFrom.cvs, 0, 0);
      ctx.globalAlpha = e;
      ctx.drawImage(bufTo.cvs, 0, 0);

    ctx.restore();
    if (onRedraw) onRedraw();

  }

    if (destroyed) return;
    destroyed = true;

    containerEl.removeEventListener('pointerenter', onEnter);
    containerEl.removeEventListener('pointermove', onMove);
    containerEl.removeEventListener('pointerleave', onLeave);

    userInteracting = false;
    activeIdx = -1;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    if (drawDefault) drawDefault(ctx, W, H);
    ctx.restore();

    if (onRedraw) onRedraw();

   The album art as a slow, flowing colour field, behind the page,

<script>/* ============================================================
   PastForward — live wallpaper (WebGL 1, no libraries).
   A slow, generative backdrop that drifts on its own and bends
   around the pointer. Four looks share one moving height field:

     contours  topographic lines, every sixth one in oxblood
               (the default: they read like a record's grooves)
     dots      a rippling grid of points
     chrome    liquid metal
     blobs     soft drifting colour

   mountWallpaper(host, { mode, focus:[x,y], reducedMotion }) → { cleanup, setMode }
   focus: where the subject sits (0..1), kept a little brighter so a
   black record never disappears into a black background.
   ============================================================ */

  opts = opts || {};
  var RM = !!opts.reducedMotion;
  var MODES = { contours: 0, dots: 1, chrome: 2, blobs: 3 };
  var mode = MODES[opts.mode] != null ? MODES[opts.mode] : 0;

    'precision highp float;',
    'uniform vec2 uRes, uPtr, uFocus; uniform float uTime, uMode, uPtrAmt, uDpr;',
    'const vec3 INK = vec3(0.075, 0.068, 0.072);',
    'const vec3 CREAM = vec3(0.953, 0.937, 0.91);',
    'const vec3 OX = vec3(0.753, 0.208, 0.247);',

    '    col *= 0.72 + 0.28 * pool;',

    // blobs: soft colour fields
    '    float b = smoothstep(-0.35, 0.45, h);',
    '    col = mix(INK, mix(vec3(0.33, 0.07, 0.1), vec3(0.62, 0.55, 0.52), smoothstep(0.4, 1.0, b)), b);',
    '    col *= 0.75 + 0.35 * pool;',
    '  }',
    '  float vig = smoothstep(1.25, 0.35, length((uv - 0.5) * vec2(asp, 1.0)));',
    '  float quiet = asp > 1.0 ? mix(0.4, 1.0, smoothstep(0.1, 0.36, uv.x)) : mix(0.6, 1.0, smoothstep(0.84, 0.64, uv.y));',
    '  quiet *= mix(0.65, 1.0, smoothstep(0.02, 0.18, uv.y));',
    '  col = mix(INK, col, quiet);',
    '  col *= 0.78 + 0.22 * vig;',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  try { gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS)); }
  catch (e) { canvas.remove(); return null; }
  gl.linkProgram(prog); gl.useProgram(prog);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var U = {}; ['uRes', 'uPtr', 'uFocus', 'uTime', 'uMode', 'uPtrAmt', 'uDpr'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

  var dpr = 1, W = 1, H = 1;
  function resize() {
    var r = host.getBoundingClientRect();
    // the wallpaper is soft, so it renders below full resolution to stay cheap on phones
    dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr));
    canvas.width = W; canvas.height = H; gl.viewport(0, 0, W, H); draw(performance.now());
  }

  // pointer, eased; in the shader's coordinates
  var ptr = [focus[0], 0.5], ptrGoal = [focus[0], 0.5], amt = 0, amtGoal = 0, lastMove = 0;
  function onMove(e) {
    var r = host.getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom) return;
    var asp = r.width / r.height;
    ptrGoal[0] = (e.clientX - r.left) / r.width * asp * 1.6;
    ptrGoal[1] = (1 - (e.clientY - r.top) / r.height) * 1.6;
    amtGoal = 1; lastMove = performance.now(); wake();
  }
  function onLeave() { amtGoal = 0; }

  var t0 = performance.now(), last = t0, raf = 0, visible = false, disposed = false;
  function draw(now) {
    var dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    if (now - lastMove > 2500) amtGoal = 0;
    amt += (amtGoal - amt) * (1 - Math.exp(-dt * 1.6));
    ptr[0] += (ptrGoal[0] - ptr[0]) * (1 - Math.exp(-dt * 3));
    ptr[1] += (ptrGoal[1] - ptr[1]) * (1 - Math.exp(-dt * 3));
    gl.uniform2f(U.uRes, W, H);
    gl.uniform2f(U.uPtr, ptr[0], ptr[1]);
    gl.uniform2f(U.uFocus, focus[0], focus[1]);
    gl.uniform1f(U.uTime, RM ? 7.0 : (now - t0) / 1000);
    gl.uniform1f(U.uMode, mode);
    gl.uniform1f(U.uPtrAmt, RM ? 0 : amt);
    gl.uniform1f(U.uDpr, dpr);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function frame(now) { raf = 0; draw(now); if (!RM && visible && !disposed) raf = requestAnimationFrame(frame); }
  function wake() { if (!raf && visible && !disposed && !RM) { last = performance.now(); raf = requestAnimationFrame(frame); } }

  var io = new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) { if (RM) draw(performance.now()); else wake(); } });
  io.observe(host);
  var ro = new ResizeObserver(resize); ro.observe(host);
  function onVis() { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else wake(); }
  document.addEventListener('visibilitychange', onVis);
  addEventListener('pointermove', onMove, { passive: true });
  host.parentElement.addEventListener('pointerleave', onLeave);
  resize();

  return {
    setMode: function (m) { if (MODES[m] != null) { mode = MODES[m]; draw(performance.now()); } },
    cleanup: function () {
      if (disposed) return; disposed = true;
      cancelAnimationFrame(raf); io.disconnect(); ro.disconnect();
      document.removeEventListener('visibilitychange', onVis);
      removeEventListener('pointermove', onMove);
      if (host.parentElement) host.parentElement.removeEventListener('pointerleave', onLeave);

    }

}

</script>

/* ============================== THE CRATE ==============================

const FMT_SHORT = { 'poster-a3': 'POSTER', 'poster-a5': 'POSTER', 'print-10': 'PRINT', 'polaroid': 'POLAROID' };
function crateList() {
  // best-selling artists from the 2025 run lead, then the rest of the featured records
  const TOP = ['The Weeknd', 'Travis Scott', 'Taylor Swift', 'Billie Eilish'];
  const ok = p => p.album !== '[CONFIRM]' && variant(p, 'vinyl');

    .sort((a, b) => (b.featured - a.featured) || (a.rank - b.rank) || (b.variants.length - a.variants.length));
  return lead.concat(rest).slice(0, 10);
}
function crateFacts(p) {
  const col = COLS.find(c => p.tags.includes(c.slug));

  return {
    album: albumText(p), artist: p.artist,
    collection: col ? col.name : 'PastForward',
    price: money(variant(p, 'vinyl').price),
    otherLabel: also.length ? 'ALSO AS' : 'ARRIVES',
    other: also.length ? also.join(' · ') : 'Ready to hang'
  };
}

  const fmts = (params.getAll('format').length ? params.getAll('format') : routeFormats) || [];
  const cols = params.getAll('collection');

    if (requiredTag && !p.tags.includes(requiredTag)) return false;
    if (fmts.length && !p.variants.some(v => fmts.includes(v.format))) return false;
    if (cols.length && !cols.some(c => p.tags.includes(c))) return false;
    if (price) {
      const matchVariants = fmts.length ? p.variants.filter(v => fmts.includes(v.format)) : p.variants;
      const f = matchVariants.length ? Math.min(...matchVariants.map(v => v.price)) : p.from;
      if (price === 'u200' && f >= 200) return false;
      if (price === '200-500' && (f < 200 || f > 500)) return false;
      if (price === '500-1000' && (f < 500 || f > 1000)) return false;

  const sort = params.get('sort') || 'featured';

    const pa = fmts.length ? Math.min(...a.variants.filter(v => fmts.includes(v.format)).map(v => v.price), a.from) : a.from;
    const pb = fmts.length ? Math.min(...b.variants.filter(v => fmts.includes(v.format)).map(v => v.price), b.from) : b.from;
    return pa - pb;
  });
  else if (sort === 'price-desc') list.sort((a, b) => {
    const pa = fmts.length ? Math.max(...a.variants.filter(v => fmts.includes(v.format)).map(v => v.price), a.from) : a.from;
    const pb = fmts.length ? Math.max(...b.variants.filter(v => fmts.includes(v.format)).map(v => v.price), b.from) : b.from;

function stageMedia(p, fmt) {
  const v = variant(p, fmt);
  if (fmt === 'vinyl') return recordHTML(p, { size: 400, sheen: true, big: true, cls: 'pdp-record' });
  if (fmt === 'polaroid') return polaroidHTML(v, { big: true, style: 'width:min(300px,72vw)' });
  return frameHTML(v, { big: true, style: `width:min(${fmt === 'print-10' ? 380 : 330}px,72vw);aspect-ratio:${v.ratio}` });
}
function scaleSVG(sel) {
  const O = { 'poster-a3': [297, 420, 'A3 POSTER', '297 × 420 MM'], 'poster-a5': [148, 210, 'A5 POSTER', '148 × 210 MM'],
    'print-10': [254, 254, '10×10 PRINT', '254 × 254 MM'], vinyl: [305, 305, '12-INCH RECORD', '12-INCH'],
  };   // polaroid card left out until its size is measured
  const baseline = 470, order = [];
  if (O[sel] && sel !== 'vinyl' && sel !== 'poster-a3') order.push(sel);
  order.push('poster-a3', 'vinyl');
  let x = 30; const nodes = [];
  order.forEach(k => {
    const [w, h, name, dim] = O[k]; const y = baseline - h; const on = k === sel;
    if (k === 'vinyl') nodes.push(`<circle class="obj ${on ? 'is-on' : ''}" cx="${x + w / 2}" cy="${y + h / 2}" r="${w / 2}"/>
      <circle cx="${x + w / 2}" cy="${y + h / 2}" r="${w * .15}" fill="none" stroke="${on ? 'var(--oxblood)' : 'var(--border-2)'}"/>`);
    else nodes.push(`<rect class="obj ${on ? 'is-on' : ''}" x="${x}" y="${y}" width="${w}" height="${h}" ${k === 'polaroid' ? 'stroke-dasharray="6 5"' : ''}/>`);
    nodes.push(`<path class="dim-line" d="M${x} ${baseline + 14} L${x} ${baseline + 30} M${x + w} ${baseline + 14} L${x + w} ${baseline + 30}"/>
      <path class="dim-line" d="M${x} ${baseline + 22} L${x + w} ${baseline + 22}" marker-start="url(#a)" marker-end="url(#a)"/>
      <text class="${on ? 'on' : ''}" x="${x}" y="${baseline + 48}">${name}</text>
      <text class="sub" x="${x}" y="${baseline + 64}">${dim}</text>`);
    x += w + 56;
  });
  const total = x + 20;
  return `<svg viewBox="0 0 ${total} 600" role="img" aria-label="Relative size diagram">
    <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0 3.5 L7 1 L7 6 Z" fill="var(--muted)"/></marker></defs>
    ${nodes.join('')}
    <path class="dim-line" d="M30 ${baseline + 92} L130 ${baseline + 92} M30 ${baseline + 86} L30 ${baseline + 98} M130 ${baseline + 86} L130 ${baseline + 98}"/>
    <text class="sub" x="138" y="${baseline + 96}">100 MM REFERENCE</text></svg>`;
}

function mountCustom() {
  const host = $('#customlabel');
  const form = document.querySelector('form[data-form="custom"]');
  if (!form) return;

  const artistInput = form.querySelector('[name="artist"]'), titleInput = form.querySelector('[name="album"]');
  if (host && window.mountVinylLabel) {
    let label;
    try { label = window.mountVinylLabel(host, { artist: artistInput?.value, title: titleInput?.value }); }
    catch (e) {}
    const sync = () => label?.update(artistInput?.value, titleInput?.value);
    artistInput?.addEventListener('input', sync);
    titleInput?.addEventListener('input', sync);
  }

  // Dynamic pricing & summary sync
  const formatSelect = form.querySelector('[name="format"]');
  const btnText = document.getElementById('custombtntext');
  const sumFormat = document.getElementById('customsummaryformat');
  const sumPrice = document.getElementById('customsummaryprice');

  const updatePrice = () => {
    const fKey = formatSelect?.value || 'vinyl';
    const f = FMT[fKey] || FMT.vinyl;
    const priceFormatted = money(f.price);
    if (btnText) btnText.textContent = `Pay ${priceFormatted} & Confirm Order`;
    if (sumPrice) sumPrice.textContent = priceFormatted;
    const sizeStr = f.size && f.size !== '[CONFIRM]' ? ` (${f.size})` : '';
    if (sumFormat) sumFormat.textContent = `Format: ${f.label}${sizeStr}`;
  };

  formatSelect?.addEventListener('change', updatePrice);
  updatePrice();
}

window.__mount = function (seg, params) {

  if (page === 'home') {
    mountHome();
    const crate = mountCrateSection(onUnmount);
    if (crate) {
      // the first CRATE_SCROLL records slide past as you scroll through the pinned section
      const root = document.getElementById('crate');
      const onCrate = () => {
        const r = root.getBoundingClientRect(), span = root.offsetHeight - innerHeight;
        // 1 while the section is still rising into view, 0 once it's pinned: drives the fade-in from the hero
        root.style.setProperty('--enter', Math.min(1, Math.max(0, r.top / innerHeight)).toFixed(3));
        if (!window.matchMedia('(max-width:767px)').matches && span > 0 && r.top < innerHeight && r.bottom > 0) crate.fromScroll(Math.min(1, Math.max(0, -r.top / span)) * CRATE_SCROLL);
      };

      window.__onScroll = y => { if (prev) prev(y); onCrate(); };
      onCrate();
    }
  }
  if (page === 'vinyl' || page === 'posters' || page === 'polaroids' || page === 'shop' || page === 'collections') mountCatalog(seg, params);
  if (page === 'product') mountProduct(bySlug[seg[1]], params);

function mountStory() {
  const host = document.getElementById('beat3rec');
  const disc = host && host.querySelector('[data-disc]');
  if (!disc || RM()) return;
  let alive = true, angle = 0, rate = 7.5, last = performance.now();
  host.addEventListener('pointerenter', () => { rate = 0; });
  host.addEventListener('pointerleave', () => { rate = 7.5; });
  host.addEventListener('pointermove', e => {
    const bx = host.getBoundingClientRect();
    host.style.setProperty('--sheen-a', (Math.atan2(e.clientY - (bx.top + bx.height / 2), e.clientX - (bx.left + bx.width / 2)) * 180 / Math.PI - 30) + 'deg');

function mountMarquees() {
  const marqs = $$('[data-marq]').map(m => ({
    el: m, t: m.querySelector('.marq__t'),
    dir: parseFloat(m.dataset.marq) || 1, x: 0, w: 0
  }));
  if (!marqs.length || RM()) return;
  marqs.forEach(m => { m.w = m.t.scrollWidth / 6; });
  let mlast = performance.now();
  let alive = true;
  let boost = 0;
  let lastY = window.scrollY || 0;
  const onScroll = () => {
    const y = window.scrollY || 0;
    const dy = Math.abs(y - lastY);
    lastY = y;
    boost = Math.min(180, boost + dy * 0.45);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onUnmount(() => {
    alive = false;
    window.removeEventListener('scroll', onScroll);
  });
  (function mloop(t) {
    if (!alive) return;
    const dt = Math.min(64, t - mlast); mlast = t;
    boost = Math.max(0, boost - dt * 0.12);
    marqs.forEach(m => {
      if (!m.w || m.w < 20) m.w = m.t.scrollWidth / 6;
      m.x -= m.dir * (26 + boost * 0.18) * dt / 1000;
      if (m.w) { if (m.x <= -m.w) m.x += m.w; if (m.x >= 0) m.x -= m.w; }
      m.t.style.transform = `translate3d(${m.x.toFixed(1)}px,0,0)`;

}

function mountHome() {

  const spins = [];

    const host = document.getElementById(id);
    const el = host && host.querySelector('[data-disc]');
    if (el) spins.push(Object.assign({ host, el, rate, base: rate, angle: 0, kick: 0, mom: 0 }, opt));
  };

    const host = document.getElementById('fdisc');
    if (!host) return;
    const glHost = document.getElementById('fdiscgl');
    let vinylApi = null;
    if (glHost && window.mountVinyl) {
      try { vinylApi = window.mountVinyl(glHost); } catch (e) { vinylApi = null; }
    }
    if (vinylApi) {
      onUnmount(() => vinylApi.cleanup());
      host.classList.add('is-gl');
      spins.push({ host, vinylApi, rate: 9, base: 9, angle: 0, kick: 0, mom: 0, boost: true });
    } else {
      const el = document.getElementById('fdiscspin');
      if (el) spins.push({ host, el, rate: 9, base: 9, angle: 0, kick: 0, mom: 0, boost: true });
    }

  if (!RM() && spins.length) {
    (function loop(t) {
      if (!homeAlive) return;
      const dt = Math.min(64, t - last); last = t;
      // decay is defined per 60fps frame below (0.93, 0.94, 0.88 all assume a ~16.7ms
      // tick) — raise each factor to the number of 60fps frames actually elapsed so a
      // flick dies at the same real-world speed on a 120Hz screen as on a 60Hz one.

          if (k === 1) { s.stopping = false; s.stopped = true; s.base = 0; s.rate = 0; }
        }

  };

    s.host.style.cursor = 'grab';
    s.host.addEventListener('pointerdown', e => {

      s.grabAngle = angleAt(s.host, e); s.grabFrom = s.angle;
      s.lastA = s.grabAngle; s.lastT = performance.now(); s.vel = 0;
      s.host.style.cursor = 'grabbing';
      s.host.setPointerCapture(e.pointerId);

    });
    s.host.addEventListener('pointermove', e => {

<script type="module">/* ============================================================
   PastForward — WebGL hero disc (adapted from a reference build).
   Self-hosted Three.js (no CDN — see build.py, which rewrites the
   import below to a data: URI of vendor/three.module.min.js so the
   page has zero runtime network dependency). The label texture uses
   only PastForward's own real microcopy — no invented track titles.
   ============================================================ */
import * as THREE from "./vendor/three.module.min.js";

/* Everything that makes a record look like a real pressing, shared by the hero disc
   and the crate carousel: seeded noise, the groove/roughness/anisotropy maps and the
   small studio it reflects. One kit per renderer (textures belong to a GL context). */
export function createVinylKit(renderer) {
  const textures = new Set();
  let seed = 781;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function makeCanvas(size) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    return c;
  }
  function textureFrom(c, color = false) {
    const texture = new THREE.CanvasTexture(c);
    if (color) texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    textures.add(texture);
    return texture;
  }

  /* A real 12" LP, to scale (disc radius 2.99 units = 152mm):
     label to r 0.965 · smooth glossy run-out (dead wax) to 1.22 · grooved programme area
     split into tracks by narrow glossy gaps · smooth lead-in from 2.86 · rounded rim.
     The look of real vinyl comes from the grooves scattering light ACROSS them, which
     turns every reflection into a thin radial streak (the "bow-tie" sheen in photos).
     That is done physically below with an anisotropy map pointing radially, so the
     highlight stays put in the room while the record turns under it. */
  const RUNOUT = 1.22, LEADIN = 2.86, EDGE = 2.955;
  const GAPS = [1.47, 1.71, 1.985, 2.215, 2.53];
  const TRACKS = [RUNOUT, ...GAPS, LEADIN].slice(1).map((end, i, a) => ({
    from: i === 0 ? RUNOUT : a[i - 1], to: end,
    rough: 0.17 + random() * 0.07,   // louder/quieter cuts reflect slightly differently
    aniso: 0.8 + random() * 0.2
  }));

  function makeVinylMaps() {
    const size = 2048, center = size / 2, px = size / 6;
    const colorCanvas = makeCanvas(size), roughCanvas = makeCanvas(size), bumpCanvas = makeCanvas(size);
    const color = colorCanvas.getContext("2d"), rough = roughCanvas.getContext("2d"), bump = bumpCanvas.getContext("2d");
    color.fillStyle = "#0b0b0c"; color.fillRect(0, 0, size, size);
    rough.fillStyle = "#3a3a3a"; rough.fillRect(0, 0, size, size);
    bump.fillStyle = "#808080"; bump.fillRect(0, 0, size, size);
    const g = v => { v = Math.max(0, Math.min(255, Math.round(v))); return `rgb(${v},${v},${v})`; };
    function ring(ctx, radius, width, stroke) {
      ctx.beginPath(); ctx.arc(center, center, radius * px, 0, Math.PI * 2);
      ctx.lineWidth = width; ctx.strokeStyle = stroke; ctx.stroke();
    }
    function band(ctx, r0, r1, fill) {
      ctx.beginPath(); ctx.arc(center, center, r1 * px, 0, Math.PI * 2); ctx.arc(center, center, r0 * px, 0, Math.PI * 2, true);
      ctx.fillStyle = fill; ctx.fill();
    }
    // run-out: near-mirror, with a few widely spaced locked/lead-out grooves
    band(rough, 0.965, RUNOUT, g(0.09 * 255));
    for (let r = 1.0; r < RUNOUT - 0.01; r += 0.034 + random() * 0.02) { ring(rough, r, 1.1, g(0.22 * 255)); ring(color, r, 1, "#101012"); }
    // programme area: very fine grooves, each track with its own sheen
    for (const t of TRACKS) {
      band(rough, t.from, t.to, g(t.rough * 255));
      for (let r = t.from + 0.006; r < t.to - 0.006; r += 0.0027 + random() * 0.0011) {
        const v = 9 + random() * 7;
        ring(color, r, 0.7, `rgb(${v},${v},${v + 1})`);
        ring(rough, r, 0.7, g((t.rough + (random() - 0.5) * 0.08) * 255));
      }
    }
    // track gaps: smooth and glossy, sitting a hair below the grooved land
    for (const r of GAPS) {
      ring(rough, r, 3, g(0.115 * 255)); ring(color, r, 3, "#0c0c0d");
      ring(bump, r, 3, "#7b7b7b");
    }
    // lead-in and the rounded rim
    band(rough, LEADIN, EDGE, g(0.09 * 255));
    for (const r of [LEADIN + 0.012, LEADIN + 0.03, LEADIN + 0.052]) ring(rough, r, 1.1, g(0.2 * 255));
    band(rough, EDGE, 3.0, g(0.14 * 255));
    ring(bump, LEADIN, 1.6, "#707070"); ring(bump, 0.968, 2, "#9a9a9a"); ring(bump, RUNOUT, 1.2, "#787878");
    // handling: faint hairline scuffs and the odd speck of dust, as on any played record
    for (let i = 0; i < 70; i++) {
      const radius = (1.0 + random() * 1.94) * px, angle = random() * Math.PI * 2, len = 0.01 + random() * 0.07;
      color.beginPath(); color.arc(center, center, radius, angle, angle + len);
      color.lineWidth = 0.5; color.strokeStyle = `rgba(160,162,170,${0.03 + random() * 0.05})`; color.stroke();
      rough.beginPath(); rough.arc(center, center, radius, angle, angle + len);
      rough.lineWidth = 0.6; rough.strokeStyle = "rgba(150,150,150,.5)"; rough.stroke();
    }
    for (let i = 0; i < 40; i++) {
      const a = random() * Math.PI * 2, r = (1.0 + random() * 1.94) * px;
      color.fillStyle = `rgba(190,190,195,${0.05 + random() * 0.08})`;
      color.fillRect(center + Math.cos(a) * r, center + Math.sin(a) * r, 1 + random() * 1.4, 1 + random() * 1.4);
    }
    return {
      map: textureFrom(colorCanvas, true), roughnessMap: textureFrom(roughCanvas),
      bumpMap: textureFrom(bumpCanvas), anisotropyMap: makeAnisotropyMap()
    };
  }

  /* RG = direction in the surface's UV frame (radial, pointing out from the spindle),
     B = strength. RingGeometry's UVs are planar, so UV x/y are the disc's own x/y. */
  function makeAnisotropyMap() {
    const A = 1024, c = A / 2, upx = A / 6;
    const cv = makeCanvas(A), ctx = cv.getContext("2d"), img = ctx.createImageData(A, A), d = img.data;
    const trackAt = r => TRACKS.find(t => r >= t.from && r < t.to);
    for (let y = 0; y < A; y++) {
      for (let x = 0; x < A; x++) {
        const dx = x + 0.5 - c, dy = -(y + 0.5 - c), len = Math.hypot(dx, dy) || 1, r = len / upx;
        let s;
        if (r < RUNOUT) s = 0.3;
        else if (r < LEADIN) {
          const t = trackAt(r), nearGap = GAPS.some(gp => Math.abs(gp - r) < 0.0055);
          s = nearGap ? 0.62 : (t ? t.aniso : 1);
        } else if (r < EDGE) s = 0.45;
        else s = 0.15;
        const i = (y * A + x) * 4;
        d[i] = (dx / len * 0.5 + 0.5) * 255; d[i + 1] = (dy / len * 0.5 + 0.5) * 255; d[i + 2] = s * 255; d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = textureFrom(cv);
    tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;   // mipmapping would blur the direction field at the spindle
    return tex;
  }

  /* a dark studio for the record to reflect: two long softboxes and a dim fill, no floor.
     Real vinyl is almost black; what you see is mostly the room reflected in it. */
  function makeStudio() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const room = new THREE.Scene();
    const owned = [];
    const add = (geo, color, pos) => {
      const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(geo, mat); mesh.position.set(...pos); mesh.lookAt(0, 0, 0);
      room.add(mesh); owned.push(geo, mat);
    };
    add(new THREE.SphereGeometry(30, 32, 16), new THREE.Color("#060607"), [0, 0, 0]);
    add(new THREE.PlaneGeometry(3.2, 2.2), new THREE.Color("#f7f5f2").multiplyScalar(7), [-5.5, 6.5, 8.5]);   // key softbox, upper left
    add(new THREE.PlaneGeometry(2.2, 1.6), new THREE.Color("#e9eefb").multiplyScalar(3), [6.5, 2.5, 9]);     // cool fill softbox, right
    add(new THREE.PlaneGeometry(12, 5), new THREE.Color("#ffffff").multiplyScalar(0.05), [0, 9, 13]);       // faint overhead fill
    const target = pmrem.fromScene(room, 0.03);
    owned.forEach(o => o.dispose()); pmrem.dispose();
    return target;
  }

  /* geometry + materials for one LP, shareable across many records in one scene */

  let seed = 7, chase = 2.2, drawnAround = -1, drawn = 0, lastBoil = 0, startAngle = 1.1, drawAnim = null;
  const P = new THREE.Vector3();
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function scribblePath(i) {
    const rec = records[i], rnd = mulberry(seed);
    const ph1 = rnd() * 6.28, ph2 = rnd() * 6.28, wob = 0.025 + rnd() * 0.02;
    const turns = 1.32 + rnd() * 0.18, steps = 120;
    const ox = rec.tx * 0.18, oy = rec.ty * 0.18;
    let d = "";
    for (let k = 0; k <= steps; k++) {
      const t = k / steps, a = startAngle + t * turns * Math.PI * 2;
      const rr = 3.0 * (1.07 + wob * Math.sin(a * 2 + ph1) + 0.018 * Math.sin(a * 5 + ph2) + 0.05 * t);
      P.set(ox + rr * Math.cos(a), oy + rr * 0.985 * Math.sin(a), 0.05);
      rec.tilt.localToWorld(P); P.project(camera);
      d += (k ? "L" : "M") + ((P.x + 1) / 2 * W).toFixed(1) + " " + ((1 - P.y) / 2 * H).toFixed(1);
    }
    return d;
  }
  function drawOn(i) {
    drawnAround = i; seed = (seed * 9301 + 49297) % 233280;
    startAngle = chase - 1.1;
    ink.setAttribute("d", scribblePath(i));
    svg.style.opacity = "1";
    if (drawAnim) drawAnim.cancel();
    drawn = 1;
    if (RM) { ink.style.strokeDashoffset = "0"; return; }
    drawAnim = ink.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 620, easing: "cubic-bezier(.3,.7,.2,1)", fill: "forwards" });
  }
  function drawOff() {
    if (drawAnim) drawAnim.cancel();
    drawn = 0;
    if (RM) { svg.style.opacity = "0"; drawnAround = -1; return; }
    const was = drawnAround;
    drawAnim = ink.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -1 }], { duration: 360, easing: "cubic-bezier(.5,0,.75,0)", fill: "forwards" });
    drawAnim.onfinish = () => { if (drawnAround === was && !drawn) { svg.style.opacity = "0"; drawnAround = -1; } };
  }

  /* ---- frame loop: only while on screen and something is changing ---- */
  let raf = 0, last = performance.now(), visible = false, disposed = false;
  function wake() { if (!raf && visible && !disposed) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function frame(now) {
    raf = 0;
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    let moving = false;

    const goal = target + dragOffset;
    const before = visual;
    const k = RM ? 1 : 1 - Math.exp(-dt * (dragOffset ? 18 : 6.5));
    visual += (goal - visual) * k;
    if (Math.abs(goal - visual) < 1e-4) visual = goal; else moving = true;
    if (!RM) spinBoost = Math.min(900, spinBoost + Math.abs(visual - before) * 600);

    const a = Math.max(0, Math.min(N - 1, Math.round(visual)));
    if (a !== active) { active = a; onActive(items[a], a); }
    if (touchOnly && !pointerIn) {
      // no hover on phones: the record that settles in front gets the loop
      const settled = Math.abs(visual - target) < 0.03 && !dragOffset;
      if (settled && drawnAround !== target) { chase = 2.2; drawOn(target); }
      else if (!settled && drawnAround !== -1 && drawn) drawOff();
    }

    spinBoost *= Math.pow(0.9, dt * 60);
    const settling = spinBoost < 4;
    records.forEach((r, i) => {
      const d = i - visual;
      const on = Math.abs(d) < 2.7;
      r.holder.visible = on;
      if (!on) return;
      r.holder.position.copy(STEP).multiplyScalar(d);
      if (d < 0) { r.holder.position.z *= 1.9; r.holder.position.y *= 1.4; }   // records already passed sink back and down, clear of the text
      r.holder.position.y += LIFT_Y;
      r.holder.position.x += SHIFT_X;
      r.holder.position.z += r.lift * 2.4;
      // records turn while the row moves, then come to rest with the art upright
      r.angle += spinBoost * (Math.abs(d) < 0.6 ? 1 : 0.6) * dt;
      if (settling) {
        const rest = Math.round(r.angle / 360) * 360, gap = rest - r.angle;
        if (Math.abs(gap) > 0.05) { r.angle += gap * (RM ? 1 : 1 - Math.exp(-dt * 2.6)); moving = true; } else r.angle = rest;
      }
      r.spin.rotation.z = -r.angle * Math.PI / 180;
      const want = i === hovered ? 1 : 0;
      r.hover += (want - r.hover) * (RM ? 1 : 1 - Math.exp(-dt * 10));
      if (Math.abs(r.hover - want) > 0.002) moving = true;
      r.tilt.rotation.set(LEAN_X - r.ty * 0.12 * r.hover, LEAN_Y + r.tx * 0.14 * r.hover, 0, "YXZ");
      r.tilt.scale.setScalar(1 + 0.025 * r.hover);
    });
    if (spinBoost > 0.5) moving = true;

    if (!pointerIn) {
      const t = now * 0.001;
      lightTarget.set(Math.cos(t * 0.5) * 7, 3 + Math.sin(t * 0.35) * 3, 9);
      if (!RM) moving = true;     // the light keeps drifting over the grooves while on screen
    }
    light.position.lerp(lightTarget, 1 - Math.exp(-5 * dt));

    if (drawnAround >= 0) {
      startAngle += ((chase - 1.1) - startAngle) * (1 - Math.exp(-dt * 4));
      if (!RM && pointerIn && now - lastBoil > 110 && now - lastMove < 300) { seed = (seed * 9301 + 49297) % 233280; lastBoil = now; }
      ink.setAttribute("d", scribblePath(drawnAround));
    }

    renderer.render(scene, camera);
    dirty = false;
    if ((moving || dirty) && visible) raf = requestAnimationFrame(frame);
  }

  const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) { dirty = true; wake(); } }, { rootMargin: "60px" });
  io.observe(stage);
  const ro = new ResizeObserver(() => { resize(); wake(); });
  ro.observe(stage);
  const onVis = () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else wake(); };
  document.addEventListener("visibilitychange", onVis);
  resize();

  function cleanup() {
    if (disposed) return; disposed = true;
    cancelAnimationFrame(raf);
    io.disconnect(); ro.disconnect();
    document.removeEventListener("visibilitychange", onVis);
    canvas.removeEventListener("pointermove", onMove);
    canvas.removeEventListener("pointerleave", onLeave);
    canvas.removeEventListener("pointerdown", onDown);
    canvas.removeEventListener("pointerup", onUp);
    canvas.removeEventListener("pointercancel", onCancel);
    const geos = new Set(), mats = new Set();
    scene.traverse(o => { if (o.geometry) geos.add(o.geometry); if (o.material) mats.add(o.material); });
    geos.forEach(g => g.dispose()); mats.forEach(m => m.dispose());
    kit.textures.forEach(t => t.dispose()); studio.dispose();
    renderer.dispose(); renderer.forceContextLoss(); canvas.remove();
  }
  return { cleanup, goTo, next, prev, fromScroll, get active() { return target; } };
}
window.mountCrate = mountCrate;
</script></body></html>
