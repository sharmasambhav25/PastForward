  }
  img.addEventListener("pointerenter", onEnter);
  img.addEventListener("pointermove", onMove);
  img.addEventListener("pointerleave", onLeave);
  img.addEventListener("pointercancel", onLeave);
  img.addEventListener("load", loadTexture);
  const observer = new ResizeObserver(resize);
  observer.observe(img);
  window.addEventListener("resize", resize);
  resize();
  if (img.complete && img.naturalWidth) loadTexture();
  return function cleanup() {
    if (disposed) return;
    disposed = true;
    cancelAnimationFrame(frame);
    observer.disconnect();
    window.removeEventListener("resize", resize);
    img.removeEventListener("pointerenter", onEnter);
    img.removeEventListener("pointermove", onMove);
    img.removeEventListener("pointerleave", onLeave);
    img.removeEventListener("pointercancel", onLeave);
    img.removeEventListener("load", loadTexture);
    if (sourceImage) sourceImage.onload = sourceImage.onerror = null;
    restoreOpacity();
    if (img.parentNode === wrapper) wrapper.replaceWith(img); else wrapper.remove();
    gl.deleteTexture(texture);
    gl.deleteBuffer(buffer);
    gl.deleteProgram(program);
    gl.getExtension("WEBGL_lose_context")?.loseContext();
  };
}
</script>
<script>/* ============================================================
   PastForward — live custom-label preview (adapted from a reference
   build; classic script, no imports). Renders a real printed-label
   mockup that updates live from the CUSTOM page's own Artist/Album
   fields — no duplicate inputs, the actual order form drives it.
   ============================================================ */
function mountVinylLabel(container, { artist = "", title = "" } = {}) {
  if (!(container instanceof HTMLElement)) throw new TypeError("Expected a DOM container.");
  const canvas = document.createElement("canvas");
  canvas.setAttribute("role", "img");
  canvas.style.cssText = "display:block;width:100%;aspect-ratio:1;border-radius:50%;box-shadow:0 30px 70px rgba(0,0,0,.5)";
  const ctx = canvas.getContext("2d");
  if (!ctx) throw new Error("Canvas 2D is unavailable.");
  container.appendChild(canvas);

  const SIZE = 640, CENTER = SIZE / 2, INK = "#181714";
  let disposed = false, current = { artist, title };

  function ring(radius, lineWidth = 1) {
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, radius, 0, Math.PI * 2);
    ctx.lineWidth = lineWidth; ctx.strokeStyle = INK; ctx.stroke();
  }
  function fittedText(text, y, maxWidth, initialSize, bold = false) {
    let size = initialSize;
    const setFont = () => { ctx.font = `${bold ? "bold " : ""}${size}px Georgia, "Times New Roman", serif`; };
    setFont();
    while (size > 12 && ctx.measureText(text).width > maxWidth) { size -= 1; setFont(); }
    ctx.fillText(text, CENTER, y, maxWidth);
  }
  function draw() {
    if (disposed) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pixels = Math.round(SIZE * dpr);
    if (canvas.width !== pixels || canvas.height !== pixels) { canvas.width = canvas.height = pixels; }
    ctx.setTransform(pixels / SIZE, 0, 0, pixels / SIZE, 0, 0);
    ctx.clearRect(0, 0, SIZE, SIZE);
    // PastForward's real crimson label, not generic cream — matches the rest of the site.
    const grad = ctx.createRadialGradient(390, 330, 60, CENTER, CENTER, 320);
    grad.addColorStop(0, "#9C2A36"); grad.addColorStop(0.56, "#83202B"); grad.addColorStop(1, "#611420");
    ctx.beginPath(); ctx.arc(CENTER, CENTER, 302, 0, Math.PI * 2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ring(287, 2); ring(279, 0.75);
    ctx.globalAlpha = 0.3; ring(63, 1); ring(67, 0.5); ctx.globalAlpha = 1;
    ctx.fillStyle = "#f3efe8";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = '17px Georgia, "Times New Roman", serif';
    ctx.fillText("PASTFORWARD · ESTD 2025", CENTER, 113);
    const artistText = (current.artist || "Your artist").toUpperCase();
    fittedText(artistText, 204, 452, 44, true);
    ctx.beginPath(); ctx.moveTo(210, 249); ctx.lineTo(430, 249); ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(243,239,232,.55)"; ctx.stroke();
    ctx.fillStyle = "#f3efe8";
    ctx.font = '16px Georgia, "Times New Roman", serif';
    ctx.fillText("SIDE A", 169, CENTER);
    ctx.fillText("33⅓ RPM", 471, CENTER);
    fittedText(current.title || "Your album or track", 432, 452, 36);
    ctx.font = '14px Georgia, "Times New Roman", serif';
    ctx.fillText("NOT FOR PLAYBACK", CENTER, 505);
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath(); ctx.arc(CENTER, CENTER, 17, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    canvas.setAttribute("aria-label", `Preview of your custom label. Artist: ${current.artist || "not entered yet"}. Album or track: ${current.title || "not entered yet"}.`);
  }
  const onResize = () => draw();
  window.addEventListener("resize", onResize);
  draw();
  return {
    update(artist, title) { current = { artist, title }; draw(); },
    cleanup() {
      if (disposed) return;
      disposed = true;
      window.removeEventListener("resize", onResize);
      canvas.remove();
    }
  };
}
</script>
<script>/* ============================================================
   PastForward — hero disc "album scrub" (adapted from a reference
   build; classic script, no imports). As the pointer moves across
   the hero disc, it scrubs through real PastForward catalogue
   albums — crossfading each one's actual cover art and real
   artist/album name onto the centre label — then fades back to the
   default PASTFORWARD label when the pointer leaves. The list of
   albums is supplied by the caller (vinyl3d.js) from the site's own
   catalogue data; this module never invents artist or album names.
   ============================================================ */
function mountAlbumScrub(containerEl, labelCanvas, ctx, opts) {
  var albums = opts.albums || [];
  var drawDefault = opts.drawDefaultLabel;
  var onRedraw = opts.onNeedsRedraw || null;
  var FADE_MS = opts.fadeDuration != null ? opts.fadeDuration : 300;

  if (!albums.length) {
    return {
      update: function () { return false; },
      cleanup: function () {}
    };
  }

  var W = labelCanvas.width;
  var H = labelCanvas.height;
  var CX = W / 2;
  var CY = H / 2;
  var R = Math.min(W, H) / 2;

  var imgCache = Object.create(null);

  function loadImage(url) {
    if (!url || imgCache[url]) return;
    var img = new Image();
    var entry = { img: img, ready: false };
    imgCache[url] = entry;
    img.onload = function () {
      entry.ready = true;
      onImageReady(url);
    };
    img.onerror = function () {};
    if (url.slice(0, 5) !== 'data:') img.crossOrigin = 'anonymous';
    img.src = url;
  }

  for (var i = 0; i < albums.length; i++) {
    loadImage(albums[i].imageUrl);
  }

  function makeBuffer() {
    var c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    return { cvs: c, ctx: c.getContext('2d') };
  }

  var bufFrom = makeBuffer();
  var bufTo = makeBuffer();

  var activeIdx = -1;
  var fading = false;
  var fadeT0 = 0;
  var hovering = false;
  var destroyed = false;

  function paintDefault(tgt) {
    tgt.save();
    tgt.setTransform(1, 0, 0, 1, 0, 0);
    tgt.globalAlpha = 1;
    tgt.clearRect(0, 0, W, H);
    if (drawDefault) drawDefault(tgt, W, H);
    tgt.restore();
  }

  function paintAlbum(tgt, entry) {
    tgt.save();
    tgt.setTransform(1, 0, 0, 1, 0, 0);
    tgt.globalAlpha = 1;
    tgt.clearRect(0, 0, W, H);

    tgt.beginPath();
    tgt.arc(CX, CY, R, 0, Math.PI * 2);
    tgt.clip();

    var c = imgCache[entry.imageUrl];
    if (c && c.ready) {
      var img = c.img;
      var s = Math.max((2 * R) / img.naturalWidth, (2 * R) / img.naturalHeight);
      var dw = img.naturalWidth * s;
      var dh = img.naturalHeight * s;
      tgt.drawImage(img, CX - dw / 2, CY - dh / 2, dw, dh);
    } else {
      tgt.fillStyle = '#111';
      tgt.fill();
    }

    var g = tgt.createRadialGradient(CX, CY, R * 0.05, CX, CY, R);
    g.addColorStop(0, 'rgba(0,0,0,0.52)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.30)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    tgt.fillStyle = g;
    tgt.beginPath();
    tgt.arc(CX, CY, R, 0, Math.PI * 2);
    tgt.fill();

    tgt.beginPath();
    tgt.arc(CX, CY, R * 0.035, 0, Math.PI * 2);
    tgt.fillStyle = '#000';
    tgt.fill();

    tgt.restore();
  }

  function paintState(tgt, idx) {
    if (idx < 0) paintDefault(tgt);
    else paintAlbum(tgt, albums[idx]);
  }

  paintDefault(ctx);
  paintDefault(bufFrom.ctx);
  if (onRedraw) onRedraw();

  function beginFade(toIdx) {
    if (toIdx === activeIdx && !fading) return;

    bufFrom.ctx.globalAlpha = 1;
    bufFrom.ctx.clearRect(0, 0, W, H);
    bufFrom.ctx.drawImage(labelCanvas, 0, 0);

    paintState(bufTo.ctx, toIdx);

    activeIdx = toIdx;
    fadeT0 = performance.now();
    fading = true;
  }

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function onImageReady(url) {
    if (destroyed || activeIdx < 0) return;
    if (albums[activeIdx].imageUrl !== url) return;

    if (fading) {
      paintState(bufTo.ctx, activeIdx);
    } else {
      paintState(bufFrom.ctx, activeIdx);
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(bufFrom.cvs, 0, 0);
      ctx.restore();
      if (onRedraw) onRedraw();
    }
  }

  function clientXToIndex(clientX) {
    var rect = containerEl.getBoundingClientRect();
    var norm = (clientX - rect.left) / rect.width;
    norm = Math.max(0, Math.min(1 - 1e-9, norm));
    return Math.floor(norm * albums.length);
  }

  function onEnter(e) {
    if (destroyed) return;
    hovering = true;
    beginFade(clientXToIndex(e.clientX));
  }

  function onMove(e) {
    if (destroyed || !hovering) return;
    var idx = clientXToIndex(e.clientX);
    if (idx !== activeIdx) beginFade(idx);
  }

  function onLeave() {
    if (destroyed) return;
    hovering = false;
    beginFade(-1);
  }

  containerEl.addEventListener('pointerenter', onEnter);
  containerEl.addEventListener('pointermove', onMove);
  containerEl.addEventListener('pointerleave', onLeave);

  function update() {
    if (destroyed || !fading) return false;

    var elapsed = performance.now() - fadeT0;
    var t = Math.min(elapsed / FADE_MS, 1);
    var e = easeInOut(t);

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    if (t >= 1) {
      fading = false;
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(bufTo.cvs, 0, 0);

      bufFrom.ctx.clearRect(0, 0, W, H);
      bufFrom.ctx.drawImage(bufTo.cvs, 0, 0);
    } else {
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = 1 - e;
      ctx.drawImage(bufFrom.cvs, 0, 0);
      ctx.globalAlpha = e;
      ctx.drawImage(bufTo.cvs, 0, 0);
    }

    ctx.restore();
    if (onRedraw) onRedraw();
    return true;
  }

  function cleanup() {
    if (destroyed) return;
    destroyed = true;

    containerEl.removeEventListener('pointerenter', onEnter);
    containerEl.removeEventListener('pointermove', onMove);
    containerEl.removeEventListener('pointerleave', onLeave);

    fading = false;
    hovering = false;
    activeIdx = -1;

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.clearRect(0, 0, W, H);
    if (drawDefault) drawDefault(ctx, W, H);
    ctx.restore();

    if (onRedraw) onRedraw();
  }

  return { update: update, cleanup: cleanup };
}
window.mountAlbumScrub = mountAlbumScrub;
</script>
<script>/* ============================================================
   PastForward — route views
   ============================================================ */
/* size 'thumb' (320px) is for the 66px PDP photo thumbnail only — every other
   photograph on the site is displayed large. Standalone builds ignore it. */
const photo = (k, size) => size === 'thumb' && (window.__PHOTOS_THUMB__ || {})[k]
  ? window.__PHOTOS_THUMB__[k] : (window.__PHOTOS__ || {})[k] || '';
const hasPhotos = () => Object.keys(window.__PHOTOS__ || {}).length > 0;
const figure = (k, cap, cls = '') => photo(k) ? `<figure class="shot ${cls}">
  <img src="${photo(k)}" alt="${esc(cap)}" loading="lazy" decoding="async">
  <figcaption class="mono-xs dim">${esc(cap)}</figcaption></figure>` : '';

const FORMAT_PHOTO = { 'vinyl':'record-in-hand', 'poster-a3':'wall-white', 'poster-a5':'wall-white',
                       'print-10':'wall-full', 'polaroid':'stall-red' };

/* ---------- v2 composition helpers ---------- */

/* the brand collage, at a strength you can actually see */
const col = (kind = 'g', cls = '') => photo('col-' + kind)
  ? `<div class="col col--${kind === 'r' ? 'r' : 'g'} ${cls}" style="background-image:url(${photo('col-' + kind)})"></div>` : '';
/* the postcard's hard 50/50 split — grey left, red right */
const split = () => (photo('col-g') && photo('col-r'))
  ? `<div class="split"><i style="background-image:url(${photo('col-g')})"></i><i style="background-image:url(${photo('col-r')})"></i></div>` : '';

/* PHOTOGRAPH — no border, no card, no shadow.
   caption in tiny mono, OUTSIDE the frame, above-left. */
const plate = (key, cap, cls = '', style = '') => photo(key)
  ? `<figure class="plate reveal ${cls}" style="${style}">
      ${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}
      <img src="${photo(key)}" alt="${esc(cap || '')}" loading="lazy" decoding="async"></figure>` : '';

/* THE ARTWORK WALL — the catalogue hung on shelves, not photographs of it.
   Each entry is [product, kind, width%, rotation, vertical nudge]. Pieces hang
   from a shared baseline and keep their true proportions: nothing is cropped. */
const hangShelf = (items, cls = '') => `<div class="shelf ${cls}">
  ${items.map(([p, kind, w, rot, dy], i) => {
    if (!p) return '';
    const v = kind === 'pola' ? variant(p, 'polaroid')
            : kind === 'rec' ? variant(p, 'vinyl')
            : (variant(p, 'poster-a3') || variant(p, 'poster-a5') || variant(p, 'print-10'));
    if (!v) return '';
    const inner = kind === 'rec'
      ? recordHTML(p, { size: 300, style: 'width:100%' })
      : kind === 'pola' ? polaroidHTML(v, { thumb: true }) : frameHTML(v, { thumb: true });
    return `<a class="hw hw--${kind} ${i > 2 ? 'hw--hide' : ''}" href="#/product/${p.slug}"
       data-cursor="VIEW" style="width:${w}%;--rot:${rot || 0}deg;--dy:${dy || 0}px;--d:${i * 60}ms">
      ${inner}<span class="hw__t">${esc(p.artist)}</span></a>`;
  }).join('')}
</div>`;

const hangWall = (shelves) => `<div class="hang-wall" id="hangwall">
  ${shelves.map((row, i) => hangShelf(row, i ? '' : 'shelf--top')).join('')}</div>`;

/* a block of type that lives inside a photo field, so the air carries something */
const isle = (cap, html, cls = '') => `<div class="isle reveal ${cls}">
  <span class="cap">${esc(cap)}</span>${html}</div>`;

/* the ad-card lockup: script over didone caps over grotesque */
const lockup = (script, caps, tag, cls = '') => `<div class="lockup ${cls}">
  <span class="lockup__script">${esc(script)}</span>
  <span class="lockup__caps">${esc(caps)}</span>
  ${tag ? `<span class="lockup__tag">${esc(tag)}</span>` : ''}</div>`;

/* a line of type cropped by the viewport on both sides */
const marq = (text, variant, speed) => `<div class="marq ${variant}" data-marq="${speed}">
  <div class="marq__t">${Array(6).fill(`<span>${esc(text)}</span>`).join('')}</div></div>`;

const bleed = (key, cap, sub, cls = '') => photo(key) ? `<div class="bleed ${cls}">
  <img src="${photo(key)}" alt="${esc(cap)}" loading="lazy" decoding="async">
  <div class="bleed__cap">${sub ? `<div class="d-s">${esc(sub)}</div>` : ''}
  <div class="mono-xs dim" style="margin-top:8px">${esc(cap)}</div></div></div>` : '';
const step = (n, key, title, body) => photo(key) ? `<div class="step reveal">

/* the tagline, set the way the brand sets it on the flex */
const TAGLINE = `<span class="tagline">designed from <em>memory,</em> made for <em>now</em></span>`;

/* ============================== HOME ============================== */
function viewHome() {
  const feat = withVinyl.filter(p => p.featured).sort((a, b) => a.rank - b.rank);
  const wallItems = feat.concat(withVinyl.filter(p => !p.featured)).slice(0, 21);

  const WP = pickArt(posterPool, 10), WL = pickArt(polaPool, 5),

  const wallArt = [
    [[WP[0], 'poster', 13, -1.4, 0], [WL[0], 'pola', 8, -5, -22], [WP[1], 'poster', 16, .9, 0],
     [WR[0], 'rec', 14, 0, -12],     [WP[2], 'poster', 12, -.7, 0], [WQ[0], 'print', 10, 1.2, -18],
     [WP[3], 'poster', 13, 1.5, 0]],
    [[WQ[1], 'print', 11, -1, 0],    [WP[4], 'poster', 15, .8, 0],  [WL[1], 'pola', 8, 4, -20],
     [WP[5], 'poster', 17, -1.2, 0], [WL[2], 'pola', 8, -6, -16],   [WR[1], 'rec', 13, 0, -9],
     [WP[6], 'poster', 12, 1.1, 0]],
    [[WP[7], 'poster', 15, .6, 0],   [WL[3], 'pola', 8, 5, -18],    [WP[8], 'poster', 18, -1.3, 0],
     [WL[4], 'pola', 8, -4, -20],    [WP[9], 'poster', 14, 1.4, 0], [WQ[2], 'print', 11, -.9, -14]],
  ].map(row => row.filter(x => x[0]));

  /* the companions chapter shows what the wall above did not */

   .slice(0, 5).forEach(p => { polas.push(p); seenArt.add(p.artist); });

  return `

/* ============================== SHOP ============================== */
const FORMAT_ROUTES = { vinyl: ['vinyl'], posters: ['poster-a3', 'poster-a5'], prints: ['print-10'], polaroids: ['polaroid'] };
function filterProducts(params, routeFormats) {
  const fmts = routeFormats || params.getAll('format');
  const cols = params.getAll('collection');
  const price = params.get('price');
  let list = P.filter(p => {
    if (fmts.length && !p.variants.some(v => fmts.includes(v.format))) return false;
    if (cols.length && !cols.some(c => p.tags.includes(c))) return false;
    if (price) {
      const f = p.from;
      if (price === 'u200' && f >= 200) return false;
      if (price === '200-500' && (f < 200 || f > 500)) return false;
      if (price === '500-1000' && (f < 500 || f > 1000)) return false;
      if (price === '1000+' && f < 1000) return false;
    }
    return true;
  });
  const sort = params.get('sort') || 'featured';
  if (sort === 'price-asc') list.sort((a, b) => a.from - b.from);
  else if (sort === 'price-desc') list.sort((a, b) => b.from - a.from);
  else if (sort === 'artist') list.sort((a, b) => a.artist.localeCompare(b.artist));
  else list.sort((a, b) => (b.featured - a.featured) || a.artist.localeCompare(b.artist));
  return list;
}
function viewShop(routeKey, params) {
  const routeFormats = FORMAT_ROUTES[routeKey];
  const list = filterProducts(params, routeFormats);
  const titles = { vinyl: ['Vinyl.', 'Upcycled 12-inch records with the album set into the label. Made to hang, not to play.'],
    posters: ['Posters.', 'A3 and A5, printed from the same artwork as the records.'],
    prints: ['Prints.', 'Ten inches square. The format that fits where a record won\'t.'],
    polaroids: ['Polaroids.', 'Small, cheap, and the reason a wall stops looking planned.'] };
  const [h1, sub] = titles[routeKey] || ['The catalogue.', `Every record, print and polaroid we make. ${COUNTS.products} pieces, and counting.`];
  const cnt = f => P.filter(p => p.variants.some(v => v.format === f)).length;
  const on = (k, v) => params.getAll(k).includes(v) ? 'checked' : '';
  const shown = +(params.get('n') || 24);
  return `<div class="wrap sec" style="padding-top:calc(var(--nav-h) + 40px)">
    <div class="masthead" style="border:0;padding-bottom:32px">
      <h1 class="d-l">${h1}</h1>
      <p class="body-l dim measure" style="margin-top:14px">${sub}</p>
      <div class="mono-xs dim" style="margin-top:18px;display:flex;gap:18px;flex-wrap:wrap">
        <a href="#/shop/vinyl">VINYL <span class="num">${cnt('vinyl')}</span></a>
        <a href="#/shop/posters">POSTERS <span class="num">${cnt('poster-a3') + cnt('poster-a5')}</span></a>
        <a href="#/shop/prints">PRINTS <span class="num">${cnt('print-10')}</span></a>
        <a href="#/shop/polaroids">POLAROIDS <span class="num">${cnt('polaroid')}</span></a>
      </div>
    </div>
    <div class="shop">
      <aside class="rail" id="rail" aria-label="Filters">
        <div class="rail__grp"><h4>Format</h4>
          ${Object.entries(FMT).map(([k, f]) => `<label class="chk"><input type="checkbox" data-f="format" value="${k}" ${on('format', k)}><span>${esc(f.label)}</span><span class="n num">${cnt(k)}</span></label>`).join('')}
        </div>
        <div class="rail__grp"><h4>Collection</h4>
          ${COLS.map(c => `<label class="chk"><input type="checkbox" data-f="collection" value="${c.slug}" ${on('collection', c.slug)}><span>${esc(c.name)}</span><span class="n num">${P.filter(p => p.tags.includes(c.slug)).length}</span></label>`).join('')}
        </div>
        <div class="rail__grp"><h4>Price</h4>
          ${[['u200', 'Under ₹200'], ['200-500', '₹200–500'], ['500-1000', '₹500–1000'], ['1000+', '₹1000+']].map(([v, l]) =>
            `<label class="chk"><input type="radio" name="price" data-f="price" value="${v}" ${params.get('price') === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}
        </div>
      </aside>
      <div>
        <div class="shop__bar">
          <span class="mono dim num">${list.length} piece${list.length === 1 ? '' : 's'}</span>
          <select class="sort" id="sort" aria-label="Sort">
            ${[['featured', 'Featured'], ['price-asc', 'Price low→high'], ['price-desc', 'Price high→low'], ['artist', 'Artist A→Z']]
              .map(([v, l]) => `<option value="${v}" ${(params.get('sort') || 'featured') === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
        ${activePills(params)}
        ${list.length ? `<div class="grid" id="grid">${list.slice(0, shown).map(cardHTML).join('')}</div>
          ${list.length > shown ? `<div style="text-align:center;margin-top:48px"><button class="btn btn--secondary" id="loadmore"><span class="btn__mag">Load more</span></button></div>` : ''}`
        : `<div style="padding:80px 0;text-align:center">
            <p class="d-s">Nothing matches that combination.</p>
            <p class="body-s dim" style="margin:8px 0 20px">Loosen a filter.</p>
            <button class="btn btn--secondary" data-clear><span class="btn__mag">Clear all</span></button></div>`}
      </div>
    </div></div>`;
}
function activePills(params) {
  const items = [];
  params.getAll('format').forEach(v => items.push(['format', v, FMT[v] ? FMT[v].label : v]));
  params.getAll('collection').forEach(v => { const c = COLS.find(c => c.slug === v); items.push(['collection', v, c ? c.name : v]); });
  if (params.get('price')) items.push(['price', params.get('price'), params.get('price')]);
  if (!items.length) return '';
  return `<div class="pills">${items.map(([k, v, l]) => `<button class="pill" data-unset="${k}|${v}">${esc(l)} ×</button>`).join('')}
    <button class="pill" data-clear style="border-color:var(--oxblood)">Clear all</button></div>`;
}

  const v = variant(p, sel);

  const related = P.filter(x => x.slug !== p.slug && (col ? x.tags.includes(col.slug) : x.artist === p.artist)).slice(0, 4);
  const rel2 = related.length ? related : P.filter(x => x.slug !== p.slug).slice(0, 4);
  return `<div class="wrap sec" style="padding-top:calc(var(--nav-h) + 32px)">
    <div class="mono-xs dim" style="margin-bottom:24px">
      <a href="#/shop">SHOP</a> / ${col ? `<a href="#/collections/${col.slug}">${esc(col.name.toUpperCase())}</a> / ` : ''}<span>${esc(albumText(p).toUpperCase())}</span>
    </div>
    <div class="pdp">
      <div>
        <div class="pdp__stage" id="stage"><div class="roomlight"></div>
          <div id="stagemedia" style="position:relative">${stageMedia(p, sel)}</div>
        </div>
        <div class="pdp__thumbs">

function stageMedia(p, fmt) {
  const v = variant(p, fmt);
  if (fmt === 'vinyl') return recordHTML(p, { size: 400, sheen: true, cls: 'pdp-record' });
  if (fmt === 'polaroid') return polaroidHTML(v, { style: 'width:min(300px,72vw)' });
  return frameHTML(v, { style: `width:min(${fmt === 'print-10' ? 380 : 330}px,72vw);aspect-ratio:${v.ratio}` });
}
function scaleSVG(sel) {
  const O = { 'poster-a3': [297, 420, 'A3 POSTER', '297 × 420 MM'], 'poster-a5': [148, 210, 'A5 POSTER', '148 × 210 MM'],
    'print-10': [254, 254, '10×10 PRINT', '254 × 254 MM'], vinyl: [305, 305, '12-INCH RECORD', '⌀ 305 MM'],
    polaroid: [100, 162, 'POLAROID', 'SIZE [CONFIRM]'] };
  const baseline = 470, order = [];
  if (sel !== 'vinyl' && sel !== 'poster-a3') order.push(sel);
  order.push('poster-a3', 'vinyl');
  let x = 30; const nodes = [];
  order.forEach(k => {
    const [w, h, name, dim] = O[k]; const y = baseline - h; const on = k === sel;
    if (k === 'vinyl') nodes.push(`<circle class="obj ${on ? 'is-on' : ''}" cx="${x + w / 2}" cy="${y + h / 2}" r="${w / 2}"/>
      <circle cx="${x + w / 2}" cy="${y + h / 2}" r="${w * .15}" fill="none" stroke="${on ? 'var(--oxblood)' : 'var(--border-2)'}"/>`);
    else nodes.push(`<rect class="obj ${on ? 'is-on' : ''}" x="${x}" y="${y}" width="${w}" height="${h}" ${k === 'polaroid' ? 'stroke-dasharray="6 5"' : ''}/>`);
    nodes.push(`<path class="dim-line" d="M${x} ${baseline + 14} L${x} ${baseline + 30} M${x + w} ${baseline + 14} L${x + w} ${baseline + 30}"/>
      <path class="dim-line" d="M${x} ${baseline + 22} L${x + w} ${baseline + 22}" marker-start="url(#a)" marker-end="url(#a)"/>
      <text class="${on ? 'on' : ''}" x="${x}" y="${baseline + 48}">${name}</text>
      <text class="sub" x="${x}" y="${baseline + 64}">${dim}</text>`);
    x += w + 56;
  });
  const total = x + 20;
  return `<svg viewBox="0 0 ${total} 600" role="img" aria-label="Relative size diagram">
    <defs><marker id="a" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0 3.5 L7 1 L7 6 Z" fill="var(--muted)"/></marker></defs>
    ${nodes.join('')}
    <path class="dim-line" d="M30 ${baseline + 92} L130 ${baseline + 92} M30 ${baseline + 86} L30 ${baseline + 98} M130 ${baseline + 86} L130 ${baseline + 98}"/>
    <text class="sub" x="138" y="${baseline + 96}">100 MM REFERENCE</text></svg>`;
}

function mountHome() {
  /* One rAF loop drives every disc. Each keeps its own angle, so no two records
     are ever in phase. Rate = idle spin + scroll boost + drag momentum. */
  const spins = [];
  const addSpin = (id, rate, opt = {}) => {
    const host = document.getElementById(id);
    const el = host && host.querySelector('[data-disc]');
    if (el) spins.push(Object.assign({ host, el, rate, base: rate, angle: 0, kick: 0, mom: 0 }, opt));
  };
  addSpin('beat3rec', 7.5, { hover: true });
  addSpin('pickrec', 6);
  addSpin('droprec', 12, { boost: true, stopper: true });

  /* the flex hero disc: same drag/momentum/scratch-sound loop as every other record —
     rendered in WebGL when available (a real lit, physical disc), falling back to the
     original CSS-composited disc if WebGL can't be created for any reason. */
  (function () {
    const host = document.getElementById('fdisc');
    if (!host) return;
    const glHost = document.getElementById('fdiscgl');
    let vinylApi = null;
    if (glHost && window.mountVinyl) {
      try { vinylApi = window.mountVinyl(glHost); } catch (e) { vinylApi = null; }
    }
    if (vinylApi) {
      host.classList.add('is-gl');
      spins.push({ host, vinylApi, rate: 9, base: 9, angle: 0, kick: 0, mom: 0, boost: true });
    } else {
      const el = document.getElementById('fdiscspin');
      if (el) spins.push({ host, el, rate: 9, base: 9, angle: 0, kick: 0, mom: 0, boost: true });
    }
  })();

  let boost = 0, last = performance.now(), lastY = scrollY;

  if (!RM() && spins.length) {
    (function loop(t) {
      const dt = Math.min(64, t - last); last = t;
      // decay is defined per 60fps frame below (0.93, 0.94, 0.88 all assume a ~16.7ms
      // tick) — raise each factor to the number of 60fps frames actually elapsed so a
      // flick dies at the same real-world speed on a 120Hz screen as on a 60Hz one.
      const f = dt / 16.6667;
      boost *= Math.pow(0.94, f);
      for (const s of spins) {
        if (s.stopping) {
          const k = Math.min(1, (t - s.stopAt) / 1800);
          s.rate = s.stopFrom * Math.pow(1 - k, 2.6);
          if (k === 1) { s.stopping = false; s.stopped = true; s.base = 0; s.rate = 0; }
        }
        const paint = () => s.vinylApi ? s.vinylApi.setAngleDeg(s.angle) : (s.el.style.transform = `rotate(${s.angle}deg)`);
        if (s.dragging) { paint(); continue; }
        let rate = s.rate + (s.boost && !s.stopped ? boost : 0) + s.mom;
        s.angle += rate * dt / 1000;
        if (s.mom) { s.mom *= Math.pow(0.93, f); if (Math.abs(s.mom) < 1) s.mom = 0; }
        if (s.kick) { const step = s.kick * (1 - Math.pow(0.88, f)); s.kick -= step; s.angle += step; if (Math.abs(s.kick) < 0.2) s.kick = 0; }
        paint();
      }
      requestAnimationFrame(loop);
    })(performance.now());
  }

  /* --- drag to spin: the disc (and the artwork on it) follows the pointer --- */
  const angleAt = (host, e) => {
    const r = host.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  };
  spins.forEach(s => {
    if (RM()) return;
    s.host.setAttribute('data-cursor', 'SPIN');
    s.host.style.cursor = 'grab';
    s.host.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch') return;      // never fight touch scrolling
      e.preventDefault();
      s.dragging = true; s.mom = 0; s.kick = 0;
      s.stopping = false; s.stopped = true;        // a dragged record is under the user's control
      s.grabAngle = angleAt(s.host, e); s.grabFrom = s.angle;
      s.lastA = s.grabAngle; s.lastT = performance.now(); s.vel = 0;
      s.host.style.cursor = 'grabbing';
      s.host.setPointerCapture(e.pointerId);
      Sound.scratchStart();
    });
    s.host.addEventListener('pointermove', e => {
      if (!s.dragging) return;
      let cur = angleAt(s.host, e);
      let d = cur - s.lastA;
      if (d > 180) d -= 360; else if (d < -180) d += 360;   // unwrap across ±180
      const now = performance.now(), dt = Math.max(8, now - s.lastT);
      s.vel = Math.max(-1400, Math.min(1400, d / (dt / 1000)));
      s.angle += d; s.lastA = cur; s.lastT = now;
      Sound.scratchUpdate(s.vel);
    });
    const release = () => {
      if (!s.dragging) return;
      s.dragging = false;
      s.host.style.cursor = 'grab';
      s.mom = s.vel;                                // flick carries through
      if (!s.stopper) { s.stopped = false; s.rate = s.base; }
      Sound.scratchStop();
    };
    s.host.addEventListener('pointerup', release);
    s.host.addEventListener('pointercancel', release);
  });

  // the examined record pauses under the pointer, but not while being dragged
  spins.filter(s => s.hover).forEach(s => {
    s.host.addEventListener('pointerenter', () => { if (!s.dragging) s.rate = 0; });
    s.host.addEventListener('pointerleave', () => { if (!s.dragging) s.rate = s.base; });
  });
  // pointer-tracked specular highlight (the light stays fixed while the disc turns)
  $$('.record--lg').forEach(rec => {
    rec.addEventListener('pointermove', e => {
      if (RM()) return;
      const bx = rec.getBoundingClientRect();
      const ang = Math.atan2(e.clientY - (bx.top + bx.height / 2), e.clientX - (bx.left + bx.width / 2)) * 180 / Math.PI;
      rec.style.setProperty('--sheen-a', (ang - 30) + 'deg');
    });
  });

  const wall = $('#wall'), rows = $$('.wall__row'), hint = $('#scrollhint');
  const build = $('#wallbuild');
  const parallaxEls = $$('[data-par]');
  if (build) {
    $$('.wb', build).forEach((el, i) => el.style.setProperty('--d', (i * 70) + 'ms'));
    if (RM()) build.classList.add('is-in');
    else new IntersectionObserver((es, io) => es.forEach(e => {
      if (e.isIntersecting) { build.classList.add('is-in'); io.disconnect(); }
    }), { threshold: 0.12 }).observe(build);
  }

  window.__onScroll = (y) => {
    const dy = Math.abs(y - lastY); lastY = y;
    boost = Math.min(220, boost + dy * 0.5);
    if (hint && y > 40) hint.style.opacity = '0';

    if (wall && rows.length && !RM() && innerWidth >= 768) {
      const r0 = wall.getBoundingClientRect();
      const total = wall.offsetHeight - innerHeight;
      const p = Math.max(0, Math.min(1, -r0.top / total));
      rows.forEach((row, ri) => {
        const speed = parseFloat(row.dataset.speed);
        const travel = Math.max(0, row.scrollWidth - innerWidth + 120);
        row.style.transform = `translate3d(${-p * travel * speed}px,0,0)`;
        // depth: each item drifts through its own near/far arc as the row scrolls past,
        // so records feel like they're flying through space, not just sliding sideways
        const items = row.__items || (row.__items = $$('.wall__item', row));
        items.forEach((el, ii) => {
          const phase = p * 7 + ii * 0.9 + ri * 1.7;
          const z = Math.sin(phase) * 130;
          const ry = Math.cos(phase * 0.6) * 10;
          const drop = +el.dataset.drop || 0;
          el.style.transform = `translate3d(0,${drop}px,${z.toFixed(1)}px) rotateY(${ry.toFixed(2)}deg)`;
        });
      });
    }
    if (!RM() && innerWidth >= 768) {
      parallaxEls.forEach(el => {
        const f = parseFloat(getComputedStyle(el).getPropertyValue('--par')) || 0;
        const r1 = el.getBoundingClientRect();
        const off = (r1.top + r1.height / 2 - innerHeight / 2) / innerHeight;
        el.style.setProperty('--py', (-off * f * 150).toFixed(1) + 'px');
      });
    }
    /* the closing record: carries scroll velocity in, then loses all of it */
    const drop = spins.find(s => s.stopper);
    if (drop && !drop.stopping && !drop.stopped && drop.host.getBoundingClientRect().top < innerHeight * 0.72) {
      drop.stopping = true;
      drop.stopAt = performance.now();
      drop.stopFrom = drop.rate + boost;          // freeze whatever speed it arrived at
      drop.boost = false;
    }
  };

  if (RM() && rows.length) {
    $('#wall').style.height = 'auto';
    $('.wall__sticky').style.cssText = 'position:static;height:auto;padding-block:48px';
    $('#wallrows').style.cssText = 'height:auto;display:flex;flex-direction:column;gap:28px';
    rows.forEach(x => { x.style.cssText = 'position:static'; x.classList.add('wall__scroller'); });
  } else if (innerWidth < 768 && rows.length) {
    $('#wall').style.height = 'auto';
    $('.wall__sticky').style.cssText = 'position:static;height:auto;padding-block:40px';
    $('#wallrows').style.cssText = 'height:auto;display:flex;flex-direction:column;gap:24px';
    rows.forEach(x => { x.style.cssText = 'position:static'; x.classList.add('wall__scroller'); });
  }
  $$('.wall__scroller').forEach(mountDragScroll);

  /* ---- marquees: two lines, opposite directions, driven by scroll + drift ---- */
  const marqs = $$('[data-marq]').map(m => ({
    el: m, t: m.querySelector('.marq__t'),
    dir: parseFloat(m.dataset.marq) || 1, x: 0, w: 0
  }));
  marqs.forEach(m => { m.w = m.t.scrollWidth / 6; });
  if (!RM() && marqs.length) {
    let mlast = performance.now();
    (function mloop(t) {
      const dt = Math.min(64, t - mlast); mlast = t;
      marqs.forEach(m => {
        if (!m.w) m.w = m.t.scrollWidth / 6;
        m.x -= m.dir * (26 + boost * 0.18) * dt / 1000;
        if (m.w) { if (m.x <= -m.w) m.x += m.w; if (m.x >= 0) m.x -= m.w; }
        m.t.style.transform = `translate3d(${m.x.toFixed(1)}px,0,0)`;
      });
      requestAnimationFrame(mloop);
    })(performance.now());
  }

  /* ---- photographs: greyscale until they arrive, then colour ---- */
  const plates = $$('.plate');
  if (plates.length) {
    if (RM()) plates.forEach(pl => pl.classList.add('is-in'));
    else {
      const pio = new IntersectionObserver((es) => es.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('is-in'); pio.unobserve(e.target); }
      }), { threshold: 0.18, rootMargin: '0px 0px -6% 0px' });
      plates.forEach(pl => pio.observe(pl));
    }
  }

  /* ---- the artwork wall hangs itself, piece by piece ---- */
  const hw = $('#hangwall');
  if (hw) {
    if (RM()) hw.classList.add('is-in');
    else new IntersectionObserver((es, io) => es.forEach(e => {
      if (e.isIntersecting) { hw.classList.add('is-in'); io.disconnect(); }
    }), { threshold: 0.08 }).observe(hw);
  }

  /* ---- annotation markers over the hero record ---- */
  const annot = $('#heroannot');
  if (annot) {
    if (RM()) annot.classList.add('is-in');
    else setTimeout(() => annot.classList.add('is-in'), 900);
  }

  // picker
  const prec = $('#pickrec'), pspin = spins.find(s => s.host && s.host.id === 'pickrec');
  mountDragScroll($('#pickthumbs'));
  $$('#pickthumbs button').forEach(btn => btn.addEventListener('click', () => {
    const p = bySlug[btn.dataset.pick]; if (!p || !prec) return;
    $$('#pickthumbs button').forEach(x => { x.classList.toggle('is-on', x === btn); x.setAttribute('aria-selected', String(x === btn)); });
    const img = $('.record__art', prec);
    const src = imgSrc(variant(p, 'vinyl').image, 'thumb');
    if (RM()) { img.src = src; }
    else {
      if (pspin) { pspin.kick = 120; pspin.stopped = false; pspin.rate = pspin.base; }
      img.animate([{ opacity: 1 }, { opacity: .12 }, { opacity: 1 }], { duration: 460, easing: 'cubic-bezier(.4,0,.2,1)' });
      setTimeout(() => { img.src = src; }, 180);
    }
    const ar = $('#pickartist'), al = $('#pickalbum');
    ar.textContent = p.artist; al.innerHTML = albumOf(p);
    if (!RM()) [ar, al].forEach(el => el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
      { duration: 360, easing: 'cubic-bezier(.16,1,.3,1)' }));
  }));
}

  i.addEventListener('input', () => {
    r.innerHTML = searchResults(i.value);
    bindEffects(r);
    setParams(pp => i.value ? pp.set('q', i.value) : pp.delete('q'));
  });
}

<script>/* ============================================================
   PastForward — boot
   ============================================================ */
function initChrome() {
  $('#cartbtn').addEventListener('click', () => { Sound.tick(); openDrawer(); });
  $('#menubtn').addEventListener('click', () => { Sound.tick(); lastFocus = document.activeElement; $('#menu').classList.add('is-open'); document.body.style.overflow = 'hidden'; });
  $('#searchbtn').addEventListener('click', () => { Sound.tick(); openSearch(); });
  const mb = $('#megabtn'), mega = $('#mega');
  let t;
  const open = () => {
    // Anchor the spring pop-open to the button that actually triggered it,
    // instead of always blooming from dead-center — spatial consistency.
    const r = mb.getBoundingClientRect();
    mega.style.transformOrigin = `${r.left + r.width / 2}px 0`;
    mega.classList.add('is-open'); mb.setAttribute('aria-expanded', 'true');
  };
  const shut = () => { mega.classList.remove('is-open'); mb.setAttribute('aria-expanded', 'false'); };
  mb.addEventListener('click', () => mega.classList.contains('is-open') ? shut() : open());
  mb.addEventListener('pointerenter', () => { clearTimeout(t); t = setTimeout(open, 120); });
  [mb, mega].forEach(el => el.addEventListener('pointerleave', () => { clearTimeout(t); t = setTimeout(shut, 220); }));
  mega.addEventListener('pointerenter', () => clearTimeout(t));
  mega.addEventListener('click', e => { if (e.target.closest('a')) shut(); });
  $('#menu').addEventListener('click', e => { if (e.target.closest('a')) closeAll(); });
  const si = $('#searchinput');
  si.addEventListener('input', () => { $('#searchres').innerHTML = searchResults(si.value); bindEffects($('#searchres')); });
  $('#search').addEventListener('click', e => { if (e.target.closest('a')) closeAll(); });
}

function pfStart() {
  document.body.insertAdjacentHTML('afterbegin', chromeHTML());
  const main = document.createElement('main');
  main.id = 'main'; main.setAttribute('tabindex', '-1');
  document.body.appendChild(main);
  document.body.insertAdjacentHTML('beforeend', footerHTML());
  initChrome(); initGrain(); initCursor(); initScroll(); grooveField(); initSound(); initGrounds(); initPre();
  syncCart();
  if (!location.hash) location.hash = '/';
  render();
  bindEffects(document);
  if (new URLSearchParams(location.search).get('brief') === '1') document.documentElement.setAttribute('data-confirm-mode', '');
  const n = document.querySelectorAll('[data-confirm]').length;
  console.log('[PastForward] catalogue:', COUNTS, '| unresolved sources:', CAT.unresolved.length);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pfStart);
else pfStart();
</script>
<script type="module">/* ============================================================
   PastForward — WebGL hero disc (adapted from a reference build).
   Self-hosted Three.js (no CDN — see build.py, which rewrites the
   import below to a data: URI of vendor/three.module.min.js so the
   page has zero runtime network dependency). The label texture uses
   only PastForward's own real microcopy — no invented track titles.
   ============================================================ */
import * as THREE from "./assets/vendor/three.module.min.js";

export function mountVinyl(container) {
  if (!(container instanceof HTMLElement)) {
    throw new TypeError("mountVinyl requires a DOM container.");
  }
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: "high-performance"
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.setClearColor(0x000000, 0);
  const canvas = renderer.domElement;
  canvas.style.cssText = "display:block;width:100%;height:100%;";
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", "A slowly rotating vinyl record, lit by a light that follows the pointer");
  container.appendChild(canvas);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, -3.6, 8.1);
  camera.lookAt(0, 0, 0);

  const textures = new Set();
  let seed = 781;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function makeCanvas(size) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    return c;
  }
  function textureFrom(c, color = false) {
    const texture = new THREE.CanvasTexture(c);
    if (color) texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    textures.add(texture);
    return texture;
  }

  function makeVinylMaps() {
    const size = 2048;
    const colorCanvas = makeCanvas(size);
    const bumpCanvas = makeCanvas(size);
    const roughCanvas = makeCanvas(size);
    const color = colorCanvas.getContext("2d");
    const bump = bumpCanvas.getContext("2d");
    const rough = roughCanvas.getContext("2d");
    color.fillStyle = "#151619"; color.fillRect(0, 0, size, size);
    bump.fillStyle = "#808080"; bump.fillRect(0, 0, size, size);
    rough.fillStyle = "#888888"; rough.fillRect(0, 0, size, size);
    const center = size / 2, px = size / 6;
    function ring(ctx, radius, width, stroke) {
      ctx.beginPath(); ctx.arc(center, center, radius * px, 0, Math.PI * 2);
      ctx.lineWidth = width; ctx.strokeStyle = stroke; ctx.stroke();
    }
    for (let r = 1.035; r < 2.965; r += 0.0038 + random() * 0.002) {
      const v = 17 + Math.floor(random() * 13);
      ring(color, r, 0.55 + random() * 0.65, `rgb(${v},${v + 1},${v + 3})`);
      ring(bump, r, 0.65 + random() * 0.5, `rgb(${45 + random() * 40},${45 + random() * 40},${45 + random() * 40})`);
      ring(rough, r, 0.8, random() > 0.5 ? "#b5b5b5" : "#696969");
    }
    for (const radius of [1.39, 1.79, 2.18, 2.57]) {
      ring(color, radius, 3.2, "#111216"); ring(bump, radius, 3.2, "#808080");
      ring(rough, radius, 3.2, "#626262"); ring(bump, radius + 0.008, 0.8, "#444444");
    }
    for (const radius of [0.985, 1.004, 1.023, 2.975, 2.985]) {
      ring(bump, radius, 1, "#424242"); ring(color, radius, 1, "#25262a");
    }
    for (let i = 0; i < 95; i++) {
      const radius = (1.08 + random() * 1.84) * px, angle = random() * Math.PI * 2;
      color.beginPath();
      color.arc(center, center, radius, angle, angle + 0.006 + random() * 0.055);
      color.lineWidth = 0.35; color.strokeStyle = `rgba(150,155,165,${0.025 + random() * 0.055})`;
      color.stroke();
    }
    return { map: textureFrom(colorCanvas, true), bumpMap: textureFrom(bumpCanvas), roughnessMap: textureFrom(roughCanvas) };
  }

  /* the printed centre label — PastForward's own microcopy only, no invented track listing.
     Built once onto `defaultLabelCanvas` (the procedural grain/text render is deterministic,
     so there's no reason to redo it later); `liveCanvas` starts as a copy of that and is the
     canvas actually mapped onto the mesh — the hover "album scrub" feature below repaints
     liveCanvas and can always crossfade back to defaultLabelCanvas without recomputing it. */
  function makeLabelMaps() {
    // PastForward's real label is crimson, not paper — match the CSS disc elsewhere on the site.
    const defaultLabelCanvas = makeCanvas(1024);
    const ctx = defaultLabelCanvas.getContext("2d");
    const grad = ctx.createRadialGradient(390, 330, 60, 512, 512, 620);
    grad.addColorStop(0, "#9C2A36"); grad.addColorStop(0.56, "#83202B"); grad.addColorStop(1, "#611420");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 1024);
    const image = ctx.getImageData(0, 0, 1024, 1024);
    const height = makeCanvas(1024);
    const heightCtx = height.getContext("2d");
    const heightImage = heightCtx.createImageData(1024, 1024);
    for (let i = 0; i < image.data.length; i += 4) {
      const grain = (random() - 0.5) * 10;
      image.data[i] += grain; image.data[i + 1] += grain; image.data[i + 2] += grain;
      const h = 128 + grain * 3;
      heightImage.data[i] = h; heightImage.data[i + 1] = h; heightImage.data[i + 2] = h; heightImage.data[i + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
    heightCtx.putImageData(heightImage, 0, 0);
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    for (const radius of [456, 445, 151]) {
      ctx.beginPath(); ctx.arc(512, 512, radius, 0, Math.PI * 2);
      ctx.lineWidth = radius === 445 ? 2 : 4; ctx.stroke();
    }
    ctx.textAlign = "center";
    ctx.fillStyle = "#f3efe8";
    ctx.font = "bold 58px Georgia, serif";
    ctx.fillText("PASTFORWARD", 512, 470);
    ctx.font = "18px Georgia, serif";
    ctx.fillText("ESTD 2025", 512, 508);
    ctx.fillStyle = "rgba(243,239,232,.55)";
    ctx.fillRect(392, 540, 240, 4);
    ctx.fillStyle = "#f3efe8";
    ctx.font = "17px sans-serif";
    ctx.fillText("33⅓ RPM  ·  NOT FOR PLAYBACK", 512, 580);

    const liveCanvas = makeCanvas(1024);
    liveCanvas.getContext("2d").drawImage(defaultLabelCanvas, 0, 0);

    return {
      maps: { map: textureFrom(liveCanvas, true), bumpMap: textureFrom(height) },
      liveCanvas,
      defaultLabelCanvas
    };
  }

  const record = new THREE.Group();
  scene.add(record);

  const outline = new THREE.Shape();
  outline.absarc(0, 0, 2.99, 0, Math.PI * 2, false);
  const hole = new THREE.Path();
  hole.absarc(0, 0, 0.085, 0, Math.PI * 2, true);
  outline.holes.push(hole);
  const bodyGeometry = new THREE.ExtrudeGeometry(outline, {
    depth: 0.055, steps: 1, bevelEnabled: true, bevelSegments: 3,
    bevelSize: 0.009, bevelThickness: 0.009, curveSegments: 192
  });
  bodyGeometry.translate(0, 0, -0.035);
  const body = new THREE.Mesh(bodyGeometry, new THREE.MeshPhysicalMaterial({
    color: "#090a0c", roughness: 0.25, metalness: 0.03, clearcoat: 0.4, clearcoatRoughness: 0.2
  }));
  record.add(body);

  const vinylMaterial = new THREE.MeshPhysicalMaterial({
    ...makeVinylMaps(), color: "#ffffff", metalness: 0.04, roughness: 0.52,
    bumpScale: 0.011, clearcoat: 0.28, clearcoatRoughness: 0.24, ior: 1.48
  });
  const surface = new THREE.Mesh(new THREE.RingGeometry(0.085, 2.992, 256), vinylMaterial);
  surface.position.z = 0.030;
  record.add(surface);

  const labelBuild = makeLabelMaps();
  const label = new THREE.Mesh(new THREE.RingGeometry(0.085, 0.965, 192), new THREE.MeshStandardMaterial({
    ...labelBuild.maps, roughness: 0.92, metalness: 0, bumpScale: 0.0012
  }));
  label.position.z = 0.034;
  record.add(label);

  /* hover "album scrub" — moving the pointer across the disc scrubs through real
     PastForward catalogue albums (their actual cover art + real artist/album name)
     on the centre label, fading back to the default PASTFORWARD label on pointer-leave.
     Built from the site's own catalogue data — never fabricated. Falls back to doing
     nothing (the disc just shows its default label, as before) if either the catalogue
     or the mountAlbumScrub module isn't available for any reason. */
  const ALBUMS = (() => {
    const products = (window.__CATALOGUE__ && window.__CATALOGUE__.products) || [];
    const out = [];
    for (const p of products) {
      if (!p.artist || !p.album || p.album === "[CONFIRM]") continue;
      const variant = p.variants.find(v => v.format === "vinyl");
      if (!variant || !variant.image) continue;
      /* thumbnails: the scrub preloads every vinyl cover eagerly on home, and a
         mid-motion label under stage lighting never needs full resolution */
      const imageUrl = window.imgSrc ? window.imgSrc(variant.image, "thumb") : "";
      if (!imageUrl) continue;
      out.push({ artist: p.artist, album: p.album, imageUrl });
    }
    return out;
  })();
  let albumScrub = null;
  if (window.mountAlbumScrub && ALBUMS.length) {
    try {
      albumScrub = window.mountAlbumScrub(container, labelBuild.liveCanvas, labelBuild.liveCanvas.getContext("2d"), {
        albums: ALBUMS,
        drawDefaultLabel: (tgt, w, h) => tgt.drawImage(labelBuild.defaultLabelCanvas, 0, 0, w, h),
        onNeedsRedraw: () => { label.material.map.needsUpdate = true; },
        fadeDuration: 320
      });
    } catch (e) { albumScrub = null; }
  }

  const light = new THREE.PointLight("#fff1da", 95, 40, 2);
  light.position.set(-1.8, 2.2, 4.5);
  scene.add(light);
  scene.add(new THREE.AmbientLight("#3a3d46", 1.1));

  const pointer = new THREE.Vector2();
  const raycaster = new THREE.Raycaster();
  const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  const lightTarget = light.position.clone();
  function onPointerMove(event) {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    pointer.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.ray.intersectPlane(interactionPlane, hit)) {
      lightTarget.set(THREE.MathUtils.clamp(hit.x, -5, 5), THREE.MathUtils.clamp(hit.y, -5, 5), 4.5);
    }
  }
  function onPointerLeave() { lightTarget.set(-1.8, 2.2, 4.5); }
  window.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerleave", onPointerLeave);

  function resize() {
    const width = Math.max(1, container.clientWidth);
    const height = Math.max(1, container.clientHeight);
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.position.set(0, -3.6, 8.1).multiplyScalar(Math.max(1, 0.95 / camera.aspect));
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
  }
  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(container);
  resize();

  let frame, disposed = false, previousTime = performance.now();
  /* rotation is driven from outside — the page's existing drag-to-spin/momentum/
     scratch-sound system (routes.js mountHome()) computes one angle per frame for
     every record on the page, CSS or WebGL alike, and calls setAngleDeg() with it.
     This mount never spins on its own, so it never fights that system. */
  let angleRad = 0;
  function setAngleDeg(deg) { angleRad = deg * Math.PI / 180; }
  function animate(now) {
    if (disposed) return;
    const dt = Math.min((now - previousTime) / 1000, 0.05);
    previousTime = now;
    record.rotation.z = -angleRad;
    light.position.lerp(lightTarget, 1 - Math.exp(-9 * dt));
    if (albumScrub) albumScrub.update();
    renderer.render(scene, camera);
    frame = requestAnimationFrame(animate);
  }
  frame = requestAnimationFrame(animate);

  function cleanup() {
    if (disposed) return;
    disposed = true;
    cancelAnimationFrame(frame);
    resizeObserver.disconnect();
    window.removeEventListener("pointermove", onPointerMove);
    canvas.removeEventListener("pointerleave", onPointerLeave);
    if (albumScrub) albumScrub.cleanup();
    const geometries = new Set(), materials = new Set();
    scene.traverse(o => {
      if (o.geometry) geometries.add(o.geometry);
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => materials.add(m));
    });
    geometries.forEach(g => g.dispose());
    materials.forEach(m => m.dispose());
    textures.forEach(t => t.dispose());
    renderer.dispose();
    renderer.forceContextLoss();
    canvas.remove();
  }
  return { cleanup, setAngleDeg };
}

window.mountVinyl = mountVinyl;
</script></body></html>
